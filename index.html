<title>ESGCT 2026 Dashboard</title>
<style>
:root{--ink:#1d2430;--mute:#5f6773;--line:#dde2ea;--bg:#f6f7f9;--card:#fff;--brand:#123b5c;--accent:#1f6fb2;--soft:#e9f2fb;
--d1:#1f6fb2;--d2:#0f7b4b;--d3:#b4570f;--d4:#7a3aa0;--star:#c98a00;--warn:#b42318;--ok:#0f7b4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6e9ee;--mute:#9aa3af;--line:#2c3440;--bg:#12161c;--card:#1a2029;--brand:#0c2a42;--accent:#5aa7e8;--soft:#1d2b3a}}
:root[data-theme="dark"]{--ink:#e6e9ee;--mute:#9aa3af;--line:#2c3440;--bg:#12161c;--card:#1a2029;--brand:#0c2a42;--accent:#5aa7e8;--soft:#1d2b3a}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:18px 28px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header h1{margin:0;font-size:21px}header .sub{opacity:.85;font-size:12.5px;margin-top:2px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:650}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.tab{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:7px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
.tab.on{background:#fff;color:var(--brand)}
#q{flex:1;min-width:180px;max-width:360px;border-radius:7px;border:0;padding:7px 10px;font-size:13px}
.flt{font-size:12px;color:#fff;display:flex;gap:4px;align-items:center;margin-left:6px}
main{max-width:1400px;margin:0 auto;padding:18px 24px 80px}
h2.sec{font-size:17px;margin:26px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--accent);color:var(--ink)}
.slot{margin:16px 0}.slot-h{font-weight:800;color:var(--mute);font-size:12.5px;margin-bottom:6px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px}
.sess{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sess.planned{border:2px solid var(--star)}.sess-h{padding:8px 11px;background:var(--soft);font-size:12.5px}
.sess-h b{display:block;font-size:13px}.sess-h .hall{color:var(--mute)}
.row{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 11px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--soft)}.row .tm{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px}
.row .ttl{font-size:13px}.row .who{font-size:12px;color:var(--mute)}
.badges{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px;vertical-align:middle}
.b{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--soft);color:var(--accent);white-space:nowrap}
.b.star{background:#fff3d6;color:#8a5d00}.b.rec{background:#e6f5ec;color:var(--ok)}.b.ph{background:#eef0ff;color:#3b3fb0}.b.sum{background:#f2e9fb;color:var(--d4)}.b.warn{background:#fde8e7;color:var(--warn)}
.code{font-weight:800;color:var(--accent);font-size:11.5px;margin-right:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;table-layout:fixed}
th{background:var(--brand);color:#fff;text-align:left;font-size:12px;padding:8px}td{border-top:1px solid var(--line);padding:8px;vertical-align:top;font-size:12.5px}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:10px 0}
.track .card{border-left:5px solid var(--accent)}.muted{color:var(--mute)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{height:84px;border-radius:5px;border:1px solid var(--line)}
audio{width:100%;max-width:520px;height:34px;margin-top:6px}
#drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:var(--card);box-shadow:-6px 0 24px rgba(0,0,0,.25);z-index:40;transform:translateX(105%);transition:transform .18s;overflow:auto;padding:20px 24px 60px}
#drawer.open{transform:none}#shade{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35;display:none}#shade.open{display:block}
#drawer h3{margin:4px 0 4px;font-size:18px}#drawer .x{float:right;border:0;background:var(--soft);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.abs{white-space:pre-wrap;font-size:12.8px;line-height:1.5;background:var(--bg);border-radius:7px;padding:10px 12px;max-height:420px;overflow:auto}
.sum h3,.sum h4,.sum h5{margin:12px 0 4px}.sum p{margin:5px 0}
.sum blockquote{margin:8px 0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0;font-size:12.8px}
.sum code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
.sum hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.sum ul{margin:5px 0;padding-left:20px}.sum li{margin:3px 0}
table.sumtab{margin:8px 0;font-size:12px;table-layout:auto}table.sumtab th{padding:6px 8px;font-size:11.5px}table.sumtab td{padding:6px 8px;vertical-align:top}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{font-size:12px;color:var(--mute);margin:4px 0 10px}
@media (max-width:640px){header{padding:14px 16px}main{padding:12px 16px 60px}.grid{grid-template-columns:1fr}}

design of new vectors for gene therapy", "hall": "Hall 3", "chairs": "Hildegard Büning", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU03", "date": "2026-10-27", "time": "09:55", "speaker": "Anja Ehrhardt", "affiliation": "", "title": "The Science of Adenoviral Vectors: How Do They Work and Why Do They Matter?", "authors": "", "session": "EDUCATION SESSION 1a - Expanding the delivery possibilities by the design of new vectors for gene therapy", "hall": "Hall 3", "chairs": "Hildegard Büning", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU04", "date": "2026-10-27", "time": "10:20", "speaker": "Roy van der Meel", "affiliation": "", "title": "LNP technology enabling vaccines, immunotherapies & gene editing", "authors": "R van der Meel", "session": "EDUCATION SESSION 1a - Expanding the delivery possibilities by the design of new vectors for gene therapy", "hall": "Hall 3", "chairs": "Hildegard Büning", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU05", "date": "2026-10-27", "time": "09:05", "speaker": "Hinrich Abken", "affiliation": "University of Regensburg", "title": "Augmenting CAR T cell capacities by synthetic circuits", "authors": "", "session": "EDUCATION SESSION 1b - Therapeutic strategies expanding the horizons of GT", "hall": "Hall 4", "chairs": "Gloria Gonzalez-Aseguinolaza", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU06", "date": "2026-10-27", "time": "09:30", "speaker": "Claudio Mussolino", "affiliation": "", "title": "Epigenome editing", "authors": "", "session": "EDUCATION SESSION 1b - Therapeutic strategies expanding the horizons of GT", "hall": "Hall 4", "chairs": "Gloria Gonzalez-Aseguinolaza", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU07", "date": "2026-10-27", "time": "09:55", "speaker": "Alessia Cavazza", "affiliation": "", "title": "VLPs for in vivo CAR-T cells", "authors": "", "session": "EDUCATION SESSION 1b - Therapeutic strategies expanding the horizons of GT", "hall": "Hall 4", "chairs": "Gloria Gonzalez-Aseguinolaza", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "09:54", "dur": 28.3, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Review of virus-like particles for in vivo CAR-T (other groups' data). Two design rules dominate: decouple targeting from fusion -- the Nipah envelope splits them natively into G and F, where VSV-G needs a point mutation to abrogate LDL-R binding plus a displayed scFv -- and keep ligand affinity LOW, since high-affinity binding impedes cargo release. Physical titer is not functional titer: high-titer preps can carry no Cas9 at all, and the Gag-cargo protease cleavage step is make-or-break. The Eyquem Nature paper is the standout: an anti-CD3 VLP carrying Cas9 RNP whose ligand also provides the proliferative cue HDR requires, plus a CD7-tropic AAV carrying a TRAC-homology CD19 donor; 20% CAR+ splenic T cells, 40% after rechallenge.", "summary": "<h3>EDU07 · VLPs for in vivo CAR-T cells<\/h3>\n<p><b>Alessia Cavazza<\/b>, University College London · Tue 27 Oct, 09:55, Hall 4 (Education Session 1b)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-27_09_54_46.txt<\/code>, 34 min, Gemini) · 2 slide photos<\/p>\n<h4>The argument<\/h4>\n<p><b>Why in vivo at all.<\/b> Ex vivo CAR-T has two cost centres: biological heterogeneity (patient-to-patient variability in memory/activation/exhaustion phenotype from prior treatment and disease burden, plus manufacturing heterogeneity — each T cell transduced or not, different expansion capacity, prolonged culture depleting the naive/memory pool) and logistics (vein-to-vein up to <b>12 weeks<\/b>, ~<b>€0.5M per patient<\/b>). In vivo removes manufacturing, cryopreservation and most QC, and additionally reaches <b>T-cell subsets you cannot harvest<\/b> — secondary lymphoid and mucosal T cells — at a more physiological repertoire.<\/p>\n<p><b>Integrating vs non-integrating is an indication choice, not a ranking.<\/b> Non-integrating (VLP + CAR mRNA): potent and early CAR expression, lost quickly as cells proliferate, but <b>redosable<\/b> — fits high-safety-bar settings, early-line autoimmune immune reset, residual haematological disease. Integrating: delayed onset, durable, potency tracks antigen burden, but late immunogenicity and second-stage expansion are hard to control — fits refractory autoimmune and advanced/solid tumours.<\/p>\n<p><b>What a VLP is.<\/b> Virus-derived, <b>no packaged viral genome<\/b>, non-infectious, non-replicating, transient cargo delivery — and highly engineerable on every axis. Enveloped VLPs are the class used for editing and in vivo CAR-T. Long history in diagnostics/biosensors and vaccination (surface antigen display); only recently used as Cas9 RNP / mRNA cargo vehicles.<\/p>\n<h4>The engineering principles (the transferable part)<\/h4>\n<p><b>1. Decouple targeting from fusion.<\/b> The single clearest design rule of the talk.<\/p>\n<ul>\n<li>VSV-G carries both functions in one molecule (binds LDL-R, then fuses). The workaround is a <b>point mutation abrogating native LDL-R binding<\/b> plus a displayed scFv.<\/li>\n<li><b>Nipah virus envelope splits them natively<\/b> — protein G targets, protein F fuses. Cleaner engineering, and it opens <b>conditional fusion gates<\/b> (e.g. protease-dependent fusion), so you can gate on target-cell state and not only on receptor identity. She expects the field to move this way.<\/li>\n<\/ul>\n<p><b>2. Ligand affinity should be LOW, not high.<\/b> Counterintuitive and actionable: high-affinity binding impedes release, so you select the receptor <i>and<\/i> the scFv for low affinity, and tune <b>avidity<\/b> via the number of particles displayed. Multi-receptor targeting additionally improves safety.<\/p>\n<p><b>3. Cargo loading and release govern potency — not titer.<\/b><\/p>\n<ul>\n<li>You can make very high-titer VLP preps <b>carrying no Cas9 at all<\/b>.<\/li>\n<li>Keep Gag+cargo cytoplasmic via nuclear export signal.<\/li>\n<li>Cargo recruitment must be tailored to the cargo: Gag-cargo fusion is the default, but <b>prime editors prefer a coiled-coil interaction over direct fusion<\/b>.<\/li>\n<li><b>Gag-Pol : Gag-cargo plasmid stoichiometry is critical<\/b> for packaging/assembly.<\/li>\n<li><b>Maturation is make-or-break<\/b>: the Gag–cargo protease site must cleave post-budding or the VLP is non-functional. Much of the field&#x27;s effort sits on protease site choice and location.<\/li>\n<li>Therefore: <b>physical titer ≠ functional titer.<\/b> You need functionality assays. <i>(This is the line worth stealing for our own particle/donor QC.)<\/i><\/li>\n<\/ul>\n<p><b>4. Immunogenicity.<\/b> VSV-G is mildly immunogenic in vivo. Alternatives explored: <b>Cocal envelope<\/b>; plus shielding by <b>PEGylation<\/b> or surface display of <b>CD47 &quot;don&#x27;t eat me&quot;<\/b> signals.<\/p>\n<h4>The three in vivo CAR-T papers she walked through<\/h4>\n<table class=\"sumtab\"><thead><tr><th><\/th><th>Approach<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td><b>Huang et al., <i>Biomaterials<\/i> (2025)<\/b><\/td><td>HIV <b>gp160 mutant<\/b> envelope (mutation broadens from CD4⁺-only to <b>CD4⁺ and CD8⁺<\/b>), Gag10 capsid, <b>CAR mRNA<\/b> cargo; humanized mouse, B-cell lymphoma<\/td><td>Single IV injection → <b>~3%<\/b> circulating CAR-T. Multi-dose (5 doses / 3 days; 95 vs 295 ng RNA per dose) → <b>~99% tumour reduction<\/b> at the higher dose. First proof that redosing works.<\/td><\/tr><tr><td><b>Doudna lab, <i>Nat Biotechnol<\/i> (2024)<\/b><\/td><td>VLP (mutant VSV-G + scFv vs CD3/CD4/CD28) carrying <b>Cas9 RNP against TCR<\/b>, co-delivered with a <b>separate lentiviral vector<\/b> carrying the CAR; NSG mice<\/td><td>Modest — <b>~1%<\/b> CAR⁺ T cells in vivo. Key finding: the CAR⁺ cells were <b>also TCR-knockout<\/b>, i.e. co-delivery enriches for doubly-modified cells. B-cell depletion well below a full LV-CAR.<\/td><\/tr><tr><td><b>Eyquem lab, <i>Nature<\/i> (2026)<\/b> — she called it the best example<\/td><td><b>Two vehicles.<\/b> VLP (HIV-derived, mutant VSV-G, <b>anti-CD3 scFv<\/b>) carrying Cas9 RNP — the anti-CD3 both targets <i>and activates<\/i>, deliberately, <b>because HDR needs proliferating cells<\/b>. Plus a <b>directed-evolution AAV, T-cell-tropic via CD7<\/b>, carrying a CD19 CAR donor flanked by <b>TRAC homology arms<\/b> → targeted integration into the TCR locus.<\/td><td><b>~20%<\/b> CAR⁺ splenic T cells; after second rechallenge <b>up to 40%<\/b> CAR⁺ in bone marrow and spleen. Efficacy in NALM6 B-cell tumour <b>and a sarcoma solid-tumour model<\/b>, with <b>no systemic inflammatory response<\/b>.<\/td><\/tr><\/tbody><\/table>\n<p>Why the Eyquem design works, in her reading: <b>multi-level specificity<\/b> — T-cell-specific VLP × T-cell-specific AAV × expression driven from the <b>TRAC promoter<\/b>. The last one gives physiological, activation-dependent, uniform CAR expression, unlike semi-random LV integration, and earlier/more potent in vivo function than an LV-CAR.<\/p>\n<h4>Her closing frame<\/h4>\n<p>Open limitations she named: targeting specificity, cargo loading and release, immune response to the VLP, and VLP manufacturing.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day1_Tue/EDU07_Cavazza.md", "followups": [], "rating": 4}, {"id": "EDU08", "date": "2026-10-27", "time": "10:20", "speaker": "Matthis Synofzik", "affiliation": "", "title": "Antisense Oligonucleotides: Programmable Medicines Beyond Gene Therapy", "authors": "M Synofzik", "session": "EDUCATION SESSION 1b - Therapeutic strategies expanding the horizons of GT", "hall": "Hall 4", "chairs": "Gloria Gonzalez-Aseguinolaza", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "10:23", "dur": 30.8, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Antisense oligonucleotides as a platform modality. Fixed backbone plus variable target sequence: 2'-MOE phosphorothioate is taken up naked by neurons, so CNS delivery is not the bottleneck. Gapmers recruit RNase H for gain-of-function disease; splice-switching ASOs restore transcript for loss-of-function. Two cautions that generalise: gapmers carry class-inherent TLR9 immunogenicity (8-10% aseptic inflammation with tofersen), and they almost never fail target engagement yet repeatedly fail clinical efficacy. The platform argument -- a drug as a box of parameters rather than a molecule, run as an umbrella trial under a master protocol, with blood transfusions and flu vaccines as precedent -- is modelled on the individualised base-editing framework.", "summary": "<h3>EDU08 · Antisense Oligonucleotides: Programmable Medicines Beyond Gene Therapy<\/h3>\n<p><b>Matthis Synofzik<\/b>, University of Tübingen · Tue 27 Oct, 10:20, Hall 4 (Education Session 1b)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-27_10_23_07_EDU08_antisense_oligo.txt<\/code>, ~37 min incl. Q&amp;A) · no slide photos<\/p>\n<p>Not gene therapy, and he said so — but the <b>platform and regulatory argument is the part worth stealing.<\/b><\/p>\n<h4>The basics<\/h4>\n<p>ASOs are 15–30 nt synthetic oligonucleotides: <b>chemicals, not biologicals<\/b>, and not ATMPs — which materially<\/p>\n<p>eases drug development and regulatory work. Structure = <b>fixed backbone + variable target sequence<\/b>, which he<\/p>\n<p>likened to a key: the backbone is the shaft, the target sequence the teeth. The backbone drives potency, cell<\/p>\n<p>uptake and toxicity, so if your backbone is known-safe you are <i>&quot;maybe 80% done&quot;<\/i>.<\/p>\n<p><b>2′-MOE phosphorothioate<\/b> is the workhorse: safe, and <b>neurons take it up naked<\/b> — intrathecally injected, no<\/p>\n<p>conjugate, no particle. For CNS, <b>delivery is simply not the problem<\/b>, which is the sharpest contrast with<\/p>\n<p>everything else at this congress. Outside CNS it very much is.<\/p>\n<p>Two mechanisms, matched to two disease classes:<\/p>\n<ul>\n<li><b>Gapmer ASOs<\/b> → bind pre-mRNA, recruit <b>RNase H<\/b>, transcript is digested → for <b>gain-of-function / toxic protein<\/b> disease.<\/li>\n<li><b>Splice-switching ASOs<\/b> → compete with splicing silencers to re-include or skip an exon → for <b>loss-of-function<\/b> disease.<\/li>\n<\/ul>\n<p>He proposed re-reading disease taxonomy accordingly: stop thinking Alzheimer&#x27;s/Parkinson&#x27;s/ALS as clinical<\/p>\n<p>syndromes and start thinking <b>&quot;protein-too-much&quot;<\/b> (gapmer) versus <b>&quot;protein-too-little&quot;<\/b> (splice-switching).<\/p>\n<h4>Two cautions on gapmers that generalise<\/h4>\n<p>1. <b>Class-inherent immunogenicity<\/b> via <b>TLR9<\/b>: in tofersen, <b>8–10% of patients get aseptic inflammation<\/b><\/p>\n<p>(mild meningitis or radiculitis).<\/p>\n<p>2. <b>Target engagement does not predict efficacy.<\/b> He was emphatic: he can hardly name a gapmer that <i>failed<\/i><\/p>\n<p>target engagement in phase 1/2 — and can name **10–20 from the last two years that showed strong knockdown and<\/p>\n<p>then failed clinically**. <i>&quot;Don&#x27;t oversell your phase 1, phase 2 trials.&quot;<\/i> An unexplained, open problem.<\/p>\n<p>Worked examples: <b>tofersen/Qalsody<\/b> for SOD1-ALS, approved largely on <b>neurofilament light chain<\/b> — one of the<\/p>\n<p>first approvals in medicine on a biomarker. <b>Nusinersen/Spinraza<\/b> for SMA, which blocks the hnRNP A1 splicing<\/p>\n<p>silencer to re-include the exon and raise SMN; splice-switchers are less immunogenic as a class.<\/p>\n<h4>N-of-1, and then the platform argument<\/h4>\n<p>First individualised ASO for a CNS disease in Europe: a boy with <b>ataxia-telangiectasia<\/b>, treated since ~2021.<\/p>\n<p>Children with this disease typically lose independent ambulation around age 7; he is climbing. For statistics they<\/p>\n<p>simulated <b>10,000 natural-history trajectories<\/b> and showed the patient falls **outside the confidence interval of<\/p>\n<p>even the most extreme simulated outlier** — a defensible way to claim efficacy in a single subject.<\/p>\n<p>The scalable version, which is the real content of the talk:<\/p>\n<ul>\n<li><b>Platform process<\/b> — run many ASO programs in parallel through a fixed, streamlined preclinical pipeline rather<\/li>\n<\/ul>\n<p>than one drug at a time. His academic lab has <b>23 ASO programs<\/b>, three in in vivo tox, expected clinic-ready 2027.<\/p>\n<ul>\n<li><b>Platform drug<\/b> — <b>repurpose the nusinersen backbone<\/b>, which has &gt;20,000 patients of PK/PD and safety behind<\/li>\n<\/ul>\n<p>it, and cross-reference the master file; you then only have to argue the target sequence.<\/p>\n<ul>\n<li><b>Umbrella trial under a master protocol<\/b> — explicitly modelled on the base-editing framework from<\/li>\n<\/ul>\n<p><b>Musunuru, Urnov and colleagues<\/b> (the &quot;baby KJ&quot; individualised base-editing case). Each new ASO is looped in as<\/p>\n<p>an offspring file under the master, which pools statistics and lets you apply for <b>platform designation<\/b>.<\/p>\n<ul>\n<li><b>The argument to the regulator<\/b>: a drug is <b>a box of parameters, not a molecule.<\/b> Same backbone, same<\/li>\n<\/ul>\n<p>sequence-length range, same preclinical criteria, same tox profile → one drug. His analogies were **blood<\/p>\n<p>transfusions<b> and <\/b>seasonal flu vaccines**, neither of which is re-approved per batch or per strain.<\/p>\n<p>Delivery beyond CNS, asked twice in Q&amp;A: <b>GalNAc conjugates<\/b> for liver are established (Ionis/Alnylam); the future<\/p>\n<p>is <b>antibody conjugates<\/b> — transferrin-receptor antibodies to cross the blood–brain barrier, or tumour-antigen<\/p>\n<p>antibodies for targeted uptake — but he put that <b>3–5 years out<\/b>. A new <b>MMA backbone<\/b> (Biogen, SMA) may cut<\/p>\n<p>intrathecal dosing from four times a year to once.<\/p>\n<p>Scale check: <b>14 approved ASOs<\/b>, but <b>40 in clinics for 80+ patients and &gt;100 in development<\/b> — individualised<\/p>\n<p>ASOs have already outpaced commercial ones in number.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day1_Tue/EDU08_Synofzik.md", "followups": [], "rating": 3}, {"id": "EDU09", "date": "2026-10-27", "time": "11:15", "speaker": "David Williams", "affiliation": "Boston Children's Hospital", "title": "Long-term effects of gene therapy", "authors": "", "session": "EDUCATION SESSION 2a - What human trials are teaching us", "hall": "Hall 3", "chairs": "Hildegard Büning", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": true, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU10", "date": "2026-10-27", "time": "11:40", "speaker": "Gloria Gonzalez-Aseguinolaza", "affiliation": "", "title": "Side effects and protein stress response", "authors": "", "session": "EDUCATION SESSION 2a - What human trials are teaching us", "hall": "Hall 3", "chairs": "Hildegard Büning", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "11:43", "dur": 24.7, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "A large part of AAV toxicity is not immune but the target cell's unfolded protein response to forced overexpression, with CHOP/DDIT3 as the switch from survival to apoptosis. Side effects appear ~3 days in, resist corticosteroids, and show no detectable adaptive response. Demonstrated causally: adding a miR-208a target site to detarget cardiomyocytes lowered protein and rescued heart histology, BiP, CHOP, ATF6 and caspase-3. An NHP liver transcriptome showed UPR together with the p53 apoptotic pathway and loss of tissue identity, correlating with expression level -- while the same dose did nothing in rats. The cleanest mechanism: CHOP-knockout rescues retinal pigment epithelium but not photoreceptors, and interferon-alpha-receptor knockout does the reverse, separating an intrinsic UPR arm from an interferon arm.", "summary": "<h3>EDU10 · Side effects and protein stress response<\/h3>\n<p><b>Gloria González-Aseguinolaza<\/b>, CIMA, University of Navarra · Tue 27 Oct, 11:40, Hall 3 (Education Session 2a)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-27_11_43_19_EDU10_-_protein_stress_response.txt<\/code>, ~27 min) · 1 slide photo (the UPR map)<\/p>\n<h4>The clinical safety landscape she is explaining<\/h4>\n<p>Main organs affected in AAV trials: liver, vasculature, CNS.<\/p>\n<ul>\n<li><b>Hepatotoxicity<\/b> — transaminase elevation, often losing the transgene and the effect; at high dose, liver failure and death.<\/li>\n<li><b>Thrombotic microangiopathy<\/b> — anti-capsid antibody drives classical complement, amplified by the alternative pathway; microclots damage kidney and lung.<\/li>\n<li><b>Dorsal root ganglia<\/b> inflammation → sensory neuropathy. <b>Myocarditis/myositis<\/b> when muscle or heart is targeted. <b>Cytokine storm<\/b> → ARDS. And, recently, <b>genotoxicity<\/b>.<\/li>\n<\/ul>\n<p><b>Dose is the variable.<\/b> Around 10¹⁴ she sees TMA reports; higher, hepatotoxicity plus TMA; <b>above ~2×10¹⁴<\/b><\/p>\n<p>(SMA, also DMD) acute liver failure and patient deaths. *&quot;AAV is very safe, but when you inject tons of AAVs you<\/p>\n<p>start seeing things you don&#x27;t want to see.&quot;*<\/p>\n<h4>Why it is not adaptive immunity<\/h4>\n<p>Three features that do not fit: side effects appear <b>~3 days<\/b> after administration; **corticosteroids do not stop<\/p>\n<p>them<b>; and when you look for capsid or transgene-directed adaptive responses in those patients, <\/b>you find nothing**.<\/p>\n<p>Hence the hypothesis: the cell cannot cope with the amount of recombinant protein it is being asked to make.<\/p>\n<h4>UPR, in one paragraph<\/h4>\n<p>BiP normally sits on three sensors — <b>ATF6, PERK, IRE1<\/b>. Unfolded protein accumulation releases them; the<\/p>\n<p>resulting transcription factors raise chaperones and <b>shut down translation<\/b> — a survival programme. But if the<\/p>\n<p>load is too high or too sustained, the <i>same<\/i> factors flip to apoptosis, with <b>CHOP (DDIT3) as the switch<\/b>.<\/p>\n<p><b>RIDD<\/b> degrades selected RNAs; caspases follow.<\/p>\n<h4>The four studies<\/h4>\n<table class=\"sumtab\"><thead><tr><th>System<\/th><th>Design<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td><b>Heart<\/b> (Yasuno et al.)<\/td><td>AAV expressing an unnamed protein<\/td><td>UPR activation observed; thin on detail<\/td><\/tr><tr><td><b>Heart<\/b> (Isabelle Richard, Genethon)<\/td><td>AAV-microdystrophin for DMD, high dose, wild-type + model mice, 1 month<\/td><td>Dose-dependent weight loss and <b>increased heart weight<\/b>; myocardium disorganised, infiltrates, fibrosis. Adding a <b>miR-208a target site<\/b> to detarget cardiomyocytes lowered protein → <b>rescued histology and fibrosis<\/b>, with <b>BiP, CHOP and ATF6 down<\/b>, homeostasis proteins restored, caspase-3 down. Same pattern repeated with an LGMD vector.<\/td><\/tr><tr><td><b>Liver<\/b> (Palazzi et al. + her own transcriptomics)<\/td><td>Escalating AAV doses in NHP; one mid-dose animal died at day 4, the rest euthanised<\/td><td>Transaminase elevation and coagulopathy. Transcriptome: <b>UPR, the p53 pathway leading to apoptosis, and loss of liver-identity genes<\/b>. CHOP up, SESN2 and SCARA3 down, <b>correlating directly with protein expression<\/b>. The <i>same dose in rats did nothing.<\/i><\/td><\/tr><tr><td><b>Retina<\/b> (Gándara et al., under revision)<\/td><td>Subretinal AAV-GFP in P0 pups; strong <b>BEST1<\/b> promoter vs weaker <b>Rho<\/b> promoter<\/td><td>Strong promoter → progressive outer-nuclear-layer and photoreceptor loss; weak promoter → no change. Transcriptome: ribosome biogenesis, ER response, intrinsic apoptosis, cytokine signalling, <b>antiviral response and leukocyte recruitment<\/b>. ATF4 and CHOP up.<\/td><\/tr><\/tbody><\/table>\n<p><b>The cleanest mechanistic result of the talk<\/b> is in that retina study&#x27;s knockouts:<\/p>\n<p>**CHOP-knockout partially rescues the retinal pigment epithelium but not photoreceptors; interferon-α-receptor<\/p>\n<p>knockout partially rescues photoreceptors but not the RPE.** Two separable mechanisms — one cell-intrinsic UPR,<\/p>\n<p>one interferon-driven and possibly non-cell-autonomous — producing the same gross phenotype.<\/p>\n<h4>Her mitigations and her open questions<\/h4>\n<p>Weaker but sufficient promoters · <b>microRNA detargeting<\/b> of sensitive cell types · monitor whether and how<\/p>\n<p>strongly UPR is activated · <b>choose the right species for toxicology<\/b> (monkeys died where rats showed nothing).<\/p>\n<p>Still unknown: the threshold a cell can tolerate, how much protein is too much, whether it is the protein, the<\/p>\n<p>vector or the combination, and whether this is happening in patients at all.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day1_Tue/EDU10_Gonzalez-Aseguinolaza.md", "followups": [], "rating": 4}, {"id": "EDU11", "date": "2026-10-27", "time": "12:05", "speaker": "Giuseppe Ronzitti", "affiliation": "", "title": "Immune responses and redosing possibilities", "authors": "", "session": "EDUCATION SESSION 2a - What human trials are teaching us", "hall": "Hall 3", "chairs": "Hildegard Büning", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU12", "date": "2026-10-27", "time": "12:30", "speaker": "Spela Mirosevic", "affiliation": "", "title": "Ultrarare diseases and patient access challenges", "authors": "S Mirosevic", "session": "EDUCATION SESSION 2a - What human trials are teaching us", "hall": "Hall 3", "chairs": "Hildegard Büning", "topic": "Clinical, access & regulatory", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU13", "date": "2026-10-27", "time": "11:15", "speaker": "Giacomo Domenici", "affiliation": "", "title": "Human 3D Microenvironment Models to Assess Responses to Gene Therapies", "authors": "G Domenici", "session": "EDUCATION SESSION 2b - Expanding GT models for mechanisms, prediction and data analysis", "hall": "Hall 4", "chairs": "Anne Galy", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU14", "date": "2026-10-27", "time": "11:40", "speaker": "Helena Zacharias", "affiliation": "", "title": "Artificial Intelligence: Opportunities and Challenges for Biomedical Research", "authors": "H Zacharias", "session": "EDUCATION SESSION 2b - Expanding GT models for mechanisms, prediction and data analysis", "hall": "Hall 4", "chairs": "Anne Galy", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "EDU15", "date": "2026-10-27", "time": "12:05", "speaker": "Michael Rothe", "affiliation": "", "title": "Safety evaluations of CGT products in vitro and in vivo", "authors": "M Rothe", "session": "EDUCATION SESSION 2b - Expanding GT models for mechanisms, prediction and data analysis", "hall": "Hall 4", "chairs": "Anne Galy", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": true, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "12:10", "dur": 20.7, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Genotoxicity assessment for cell and gene therapy. Vector class matters less than the element you put in -- a lentiviral product using the potent MND promoter still produced blood cancers in ~10% of treated patients. In a Wiskott-Aldrich patient the malignant clone was prominent in bone marrow while peripheral blood looked entirely normal, which matters because long-term follow-up conventionally samples blood. Their SAGA assay reduces a transformation transcriptional signature to four predictors in a ddPCR format, replacing variable colony assays. On AAV: three tumour cases now associated with GLI1 integration, one still unpublished; AAV also integrates at CRISPR-induced double-strand breaks, so a donor can end up integrated. Whole-chromosome loss needs RNA-seq, as NGS panels miss it.", "summary": "<h3>EDU15 · Safety evaluations of CGT products in vitro and in vivo<\/h3>\n<p><b>Michael Rothe<\/b>, Hannover Medical School · Tue 27 Oct, 12:05, Hall 4 (Education Session 2b)<\/p>\n<p>Source: partial transcript — recording starts mid-talk (<code>Transcripts/2026-10-27_12_10_09_EDU15_Rothe.txt<\/code>, ~17 min incl. Q&amp;A) · no slide photos<\/p>\n<h4>Insertional mutagenesis — and why &quot;lentiviral is safe&quot; is a half-truth<\/h4>\n<p>A retroviral vector integrates wherever chromatin is accessible; the more potent the promoter/enhancer you drive the<\/p>\n<p>transgene with, the higher the chance of disturbing a neighbouring proto-oncogene or disrupting a tumour suppressor.<\/p>\n<p>Severe events were historically associated with gammaretroviral vectors and the field concluded lentiviral was safe.<\/p>\n<p><b>Relatively safe.<\/b> His counter-example is <b>Skysona<\/b> (cerebral ALD), a lentiviral product using the potent<\/p>\n<p>artificial <b>MND<\/b> promoter, where <b>~10% of the treated population developed blood cancers.<\/b> His framing:<\/p>\n<p><i>it depends on what element you put in<\/i>, not on which vector class it is.<\/p>\n<p>Typical culprits he named: <b>MECOM<\/b>, <b>LMO2<\/b>, and a third transcription factor the transcript garbles.<\/p>\n<h4>The Wiskott–Aldrich case — the part worth remembering<\/h4>\n<p>Contacted last year by Munich to study a patient from the old WAS trial in which **8 of 9 treated patients developed<\/p>\n<p>some form of leukaemia**. Patient 4 was one of two described as <i>healthy<\/i> in the original publication. He developed<\/p>\n<p>leukaemia at ~5 years, was treated with chemotherapy and an unrelated-donor transplant; at ~9 years a second<\/p>\n<p>leukaemia, chemo and cells from his mother; then a third, and he died.<\/p>\n<p>They checked molecularly whether the integrations in the malignant clone were the same across episodes — **they were<\/p>\n<p>the same clone**, carrying the same harmful integration, 16 years on.<\/p>\n<p><b>The observation to carry forward:<\/b> at the time the clone was unmistakable and prominent **in the bone marrow, the<\/p>\n<p>peripheral blood looked completely normal.** The clone was hiding. Long-term follow-up conventionally samples<\/p>\n<p>peripheral blood — so, in his words, <i>we may be missing these signals if we are unlucky.<\/i> Patients are monitored for<\/p>\n<p>15 years and he does not think 15 years is necessarily enough.<\/p>\n<h4>Assays — including one we could actually use<\/h4>\n<ul>\n<li><b>IVIM<\/b> (in vitro immortalization): murine HSPCs, high vector dose, two weeks culture, seed at very low density;<\/li>\n<\/ul>\n<p>mutagenic vectors give surviving clones on the plate. But <i>&quot;biology is messy&quot;<\/i> — the plating phenotype is<\/p>\n<p><b>inherently variable<\/b>, sometimes even for their positive controls.<\/p>\n<ul>\n<li>Hence <b>SAGA<\/b>, a molecular readout: they trained a classifier on the **transcriptional signature associated with<\/li>\n<\/ul>\n<p>transformation<b>. It works well, and they then reduced it to the <\/b>top four predictors** and built<\/p>\n<p><b>a ddPCR-based &quot;SAGA-Q&quot;<\/b> to screen vector architectures. *This is the transferable piece — a cheap ddPCR<\/p>\n<p>genotoxicity screen rather than a six-week colony assay.*<\/p>\n<ul>\n<li><b>Tumour-prone mouse models<\/b> (Cdkn2a tumour suppressor knocked out — all die eventually, mutagenic vectors kill<\/li>\n<\/ul>\n<p>them sooner, so you can rank vectors).<\/p>\n<ul>\n<li><b>iPSC-derived models<\/b> (he named one marketed as &quot;invitox&quot;), differentiating to liver-like cells and comparing<\/li>\n<\/ul>\n<p>integration, transcriptome and epigenome. All of these models, he stressed, are <i>far from perfect<\/i>.<\/p>\n<h4>Challenging the dogma: AAV is not as episomal as advertised<\/h4>\n<p>AAV remains mostly episomal, so insertional-mutagenesis risk is low — <b>but<\/b>:<\/p>\n<ul>\n<li><b>May this year<\/b> (Bushman, St George and colleagues): a **neuroepithelial tumour associated with an AAV<\/li>\n<\/ul>\n<p>integration**. The integrant was a <i>Frankenstein<\/i> structure — CMV enhancer / CBA promoter / CBA intron fused to an<\/p>\n<p>exon of <b>GLI1<\/b>, a proto-oncogene, and on the genomic level it included a stretch of **chromosome 10 derived from<\/p>\n<p>the HEK293T producer cells**, somehow packaged into the particle.<\/p>\n<ul>\n<li><b>Two weeks ago<\/b>, a second case in the <i>New England Journal<\/i> — a neoplasm, again with a <b>GLI1<\/b> integration.<\/li>\n<li><b>He is working on a third case. Again GLI1.<\/b> His line: *&quot;it&#x27;s not a question whether it can happen, but how<\/li>\n<\/ul>\n<p>often we observe it in the future.&quot;*<\/p>\n<ul>\n<li>The arithmetic: AAV is mostly episomal, but <b>0.01% of a very high vector dose is still a lot of genomes<\/b>.<\/li>\n<\/ul>\n<p><b>Q&amp;A, and this is the important qualifier.<\/b> Matthew (Voyager Therapeutics) pointed out that **6,000+ patients have<\/p>\n<p>received AAV without such events**, and that the cases which did occur — including the Krabbe case in the NEJM — had<\/p>\n<p>been <b>myeloablatively conditioned beforehand<\/b>. Rothe accepted the point and extended it: raising the level of<\/p>\n<p>genomic stress and double-strand breaks may be exactly what lets these rearranged AAV genomes integrate. He also<\/p>\n<p>believes it is <b>under-diagnosed<\/b>, because AAV integrants are highly rearranged with parts missing, so routine<\/p>\n<p>copy-number analysis can simply miss the region you are using for detection.<\/p>\n<h4>Precision medicine is less precise than it sounds<\/h4>\n<p>CRISPR causes a double-strand break and the cell repairs it imperfectly — fine for knockout, and with a donor you<\/p>\n<p>get HDR. **But he warned specifically that AAV is prone to integrating into the double-strand break, so you can end<\/p>\n<p>up with an integrated copy of your donor molecule.** Heavy structural rearrangements are often lethal to the cell<\/p>\n<p>and counter-selected, but some persist and our assays may not detect them.<\/p>\n<p>On detection limits: whole-genome sequencing is limited in depth and will miss events; increasing depth increases<\/p>\n<p>cost steeply, which is why the field uses targeted sequencing. He recommended a **targeted approach using<\/p>\n<p>inverse/spatial PCR with 5′ primers<b> to see what has been captured. <\/b>All NGS assays struggle with whole-chromosome<\/p>\n<p>loss — for that, use deeper RNA sequencing.** Base and prime editing bring their own risk profiles but largely<\/p>\n<p>remove the double-strand break.<\/p>\n<p>Asked to compare editing versus viral risk, he declined to rank them and made a different point: the field thought<\/p>\n<p>integrating vectors were low-risk, then cases accumulated and understanding improved; the same will happen with AAV,<\/p>\n<p>and then with CRISPR. <i>Look at the disease you are treating — but you are obliged to study the cases.<\/i><\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day1_Tue/EDU15_Rothe.md", "followups": [], "rating": 4}, {"id": "EDU16", "date": "2026-10-27", "time": "12:30", "speaker": "Mauro Giacca", "affiliation": "Kings College London", "title": "Disease models, epigenetic and age factors of susceptibility to AAV", "authors": "", "session": "EDUCATION SESSION 2b - Expanding GT models for mechanisms, prediction and data analysis", "hall": "Hall 4", "chairs": "Anne Galy", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV01", "date": "2026-10-27", "time": "14:30", "speaker": "Dimitrios Mougiakakos", "affiliation": "", "title": "T cell-mediated B cell depletion in autoimmunity", "authors": "D Mougiakakos", "session": "SESSION 1: ESGCT 2026 Opening: Clinical applications of gene therapy", "hall": "Hall 1", "chairs": "Alberto Auricchio; Zoltan Ivics; Boris Fehse", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV02", "date": "2026-10-27", "time": "15:00", "speaker": "Giuliana Ferrari", "affiliation": "SR-Tiget, Milan", "title": "Impact of HSC signature on gene therapy for beta-thalassemia", "authors": "", "session": "SESSION 1: ESGCT 2026 Opening: Clinical applications of gene therapy", "hall": "Hall 1", "chairs": "Alberto Auricchio; Zoltan Ivics; Boris Fehse", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "14:51", "dur": 33.7, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Eleven years of GLOBE lentiviral gene therapy for beta-thalassemia, then the mechanism. Transfusion independence tracked with at least one vector copy in vivo and over 40% marking; two children relapsed as they grew past a borderline corrected haemoglobin. The new trial shortens culture from 60 to 40 hours with transduction enhancers, purely to preserve stemness. The notable finding: splitting patients by sustained versus declining marking and running single-cell RNA-seq on the stem-cell source showed good outcomes enriched for inflammatory-memory and TGF-beta programmes associated with quiescence, and poor outcomes associated with interferon signalling -- present in the source material before transplant. Pre-existing HSC state appears to shape long-term outcome.", "summary": "<h3>INV02 · Impact of HSC signature on gene therapy for beta-thalassemia<\/h3>\n<p><b>Giuliana Ferrari<\/b>, SR-Tiget / San Raffaele, Milan · Tue 27 Oct, 15:00, Hall 1 (Session 1, opening plenary)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-27_14_51_20_INV02_Ferrari_thalassemia.txt<\/code>, ~26 min) · no slide photos<\/p>\n<h4>Clinical backbone (GLOBE LV, 11 years of follow-up)<\/h4>\n<p>Phase 1/2 from 2015: G-CSF + Plerixafor mobilisation, CD34 selection, <b>60 h transduction<\/b> with the GLOBE<\/p>\n<p>lentiviral vector (β-globin under a shortened LCR, two elements + β-globin promoter), Treosulfan/Thiotepa<\/p>\n<p>conditioning, <b>intra-bone<\/b> administration. Three adults, three adolescents, three children.<\/p>\n<ul>\n<li>Dose ~20×10⁶ CD34/kg; <b>VCN 0.7–1.5 in the drug product<\/b>; transduction efficiency <b>40–77%<\/b>. No GT-related AEs.<\/li>\n<li>Six patients reached transfusion independence. <b>Two later restarted transfusions<\/b> — both young children whose<\/li>\n<\/ul>\n<p>corrected Hb was borderline (~9 g/dL); as they grew, demand rose and a stable-but-low copy number no longer sufficed.<\/p>\n<ul>\n<li><b>The two thresholds worth writing down:<\/b> transfusion independence tracked with <b>≥1 VCN <i>in vivo<\/b><\/i> (not in the<\/li>\n<\/ul>\n<p>drug product) and <b>&gt;40% marking<\/b>. Marking in bone marrow ranged from &lt;10% to 80% across patients.<\/p>\n<p><b>New trial, now enrolling: BetaTal T007<\/b> (phase 2b, academic/affordable — Telethon + San Raffaele + Bambino Gesù;<\/p>\n<p>primary endpoint TI &gt;12 months; first two patients in). Changes from the old protocol, all aimed at stemness:<\/p>\n<p><b>transduction enhancers<\/b>, <b>culture shortened 60 h → 40 h<\/b> with a <b>single transduction hit<\/b>, busulfan instead of<\/p>\n<p>treosulfan, <b>IV instead of intra-bone<\/b>. She was explicit that the shortening was conceived to preserve stemness<\/p>\n<p>and is supported by NSG transplant data, but has no human read-out yet.<\/p>\n<h4>The bench half — why some grafts decline<\/h4>\n<p>Her lab was first to show the <b>bone marrow niche is altered in a non-malignant disease<\/b> (Aprile et al.): stromal<\/p>\n<p>and supporting subpopulations are disturbed in β-thal and impair HSC function. <b>FGF23<\/b> came out as a mapped,<\/p>\n<p>potentially druggable signal sitting at the crossroad of haematopoiesis and bone metabolism — relevant because<\/p>\n<p>these patients have chronic osteoporosis.<\/p>\n<p>scRNA-seq, β-thal vs healthy donor bone marrow:<\/p>\n<ul>\n<li><b>decreased HSC quiescence and dormancy<\/b><\/li>\n<li><b>erythroid commitment skewed early<\/b>, already at the HSC / primitive progenitor level<\/li>\n<li>driven by altered <b>TGF-β production from mesenchymal stromal cells<\/b><\/li>\n<li>TGF-β, autophagy and TNF-α signatures down; <b>inflammatory response is the hallmark<\/b><\/li>\n<\/ul>\n<h4>The result to act on<\/h4>\n<p>She split her own trial patients into <b>sustained marking<\/b> vs <b>declined marking<\/b> (VCN in CD34 cells over time)<\/p>\n<p>and ran scRNA-seq on three sample types: pre-GT bone marrow, the mobilised peripheral blood used as the HSC source,<\/p>\n<p>and post-GT bone marrow.<\/p>\n<table class=\"sumtab\"><thead><tr><th><\/th><th>Sustained marking (good outcome)<\/th><th>Declined marking (limited outcome)<\/th><\/tr><\/thead><tbody><tr><td>In the <b>stem-cell source<\/b><\/td><td>enriched for <b>inflammatory-memory (HSC-IM) programs<\/b> and <b>TGF-β signalling<\/b> → increased quiescence<\/td><td><b>interferon signalling genes up<\/b>; TNF-α and IFN programs dysregulated<\/td><\/tr><tr><td>Post-GT bone marrow<\/td><td>inflammatory landscape <b>mirrors<\/b> what was there before GT<\/td><td>same mirroring<\/td><\/tr><\/tbody><\/table>\n<p>Her interpretation: HSC-IM cells carry an epigenetic memory of inflammatory exposure and are <i>more quiescent<\/i>,<\/p>\n<p>protecting haematopoiesis from continuous stimuli — and that quiescence is what survives transplant. Conversely<\/p>\n<p><b>interferon signalling in the source material is associated with a graft that fades.<\/b> She proposes this could be<\/p>\n<p>read <b>before enrolment<\/b> to predict outcome.<\/p>\n<p><b>Asked directly<\/b> whether the interferon up-regulation could be an artefact of the lentiviral vector or the<\/p>\n<p>manufacturing, she answered that GMP manufacturing was identical across all patients, so she attributes it to the<\/p>\n<p>state of the cells at source — while conceding that properly studying BM subpopulations needs a biopsy, not an aspirate.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day1_Tue/INV02_Ferrari.md", "followups": [], "rating": 5}, {"id": "INV03", "date": "2026-10-27", "time": "15:30", "speaker": "William Schief", "affiliation": "", "title": "Germline-targeting vaccine design to elicit HIV broadly neutralizing antibodies", "authors": "", "session": "SESSION 1: ESGCT 2026 Opening: Clinical applications of gene therapy", "hall": "Hall 1", "chairs": "Alberto Auricchio; Zoltan Ivics; Boris Fehse", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "15:25", "dur": 34.1, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Germline-targeting vaccine design: program a pre-specified antibody response by selecting and maturing rare naive B cells, rather than delivering genetic material. For the V-gene-dominant VRC01 class, prime plus one heterologous boost produced elite responses in 94% of participants at 1 in 8,000 PBMCs, highly polyclonal, with cryo-EM confirming the native binding mode. For the harder HCDR3-dominant BG18 class, with a naive precursor frequency near 1 in 50 million, a single vaccination produced the target response in over 92% of recipients. In non-human primates a prime plus seven boosts elicited serum broadly neutralising antibodies, the best animal reaching over 80% breadth. A safety signal worth noting: RNA-delivered HIV immunogens caused 6.5-11.7% urticaria, far above non-HIV RNA vaccines, which the speaker attributes to the antigen rather than the platform.", "summary": "<h3>INV03 · Germline-targeting vaccine design to elicit HIV broadly neutralizing antibodies<\/h3>\n<p><b>William Schief<\/b>, Scripps Research / IAVI / Moderna · Tue 27 Oct, 15:30, Hall 1 (Session 1, opening plenary)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-27_15_25_09_inv03_HIV.txt<\/code>, ~36 min incl. Q&amp;A) · no slide photos<\/p>\n<h4>The strategy<\/h4>\n<p>HIV&#x27;s envelope trimer is shielded by self-like glycans with a hypervariable protein surface, so most antibodies<\/p>\n<p>neutralise one isolate out of hundreds of thousands. Broadly neutralising antibodies (bNAbs) exist, bind conserved<\/p>\n<p>epitopes, and give sterilising immunity in NHP and protection in humans — but you cannot get them by ordinary vaccination.<\/p>\n<p><b>Germline targeting<\/b>: start from a structure of a bNAb bound to the spike, define the *minimal set of genetic<\/p>\n<p>properties* a naive human B cell needs to have the potential to mature into that bNAb, then design a priming<\/p>\n<p>immunogen that triggers exactly those naive B cells — followed by a sequence of increasingly wild-type-like boosts<\/p>\n<p>that shepherd maturation toward bNAbs and, finally, long-lived plasma cells.<\/p>\n<h4>Results<\/h4>\n<p><b>VRC01-class<\/b> (CD4-binding site, unusually V-gene-dominant, i.e. the easy case):<\/p>\n<ul>\n<li>2022: a nanoparticle displaying 60 copies of a priming domain; <b>all but one participant<\/b> produced the target<\/li>\n<\/ul>\n<p>B cells. The non-responder was <b>homozygous for a non-permissive VH1-2 allele<\/b> — the genetics said no, and it was no.<\/p>\n<ul>\n<li>Crystal structures (Ian Wilson&#x27;s lab) showed the elicited antibodies bind the same patch at the same angle as<\/li>\n<\/ul>\n<p>real bNAbs — <b>tailor-made antibody responses<\/b>, not just genetically similar ones.<\/p>\n<ul>\n<li>Moving to <b>mRNA<\/b> (Moderna) for affordability and speed across many sequential antigens: trials <b>IAVI G002<\/b><\/li>\n<\/ul>\n<p>(US, prime + heterologous boost) and <b>G003<\/b> (Rwanda and South Africa, prime only, deliberately sited where the<\/p>\n<p>vaccine is needed). RNA was <b>more immunogenic than protein<\/b> at that dose; one shot sufficed.<\/p>\n<ul>\n<li>After prime + one heterologous boost, <b>94% of participants<\/b> made &quot;elite&quot; responses (≥5 key maturation residues),<\/li>\n<\/ul>\n<p>at <b>1 in 8,000 PBMCs<\/b>, and <b>highly polyclonal<\/b> — 16 independent elite clones recovered from 100 million PBMCs.<\/p>\n<p><b>BG18-class<\/b> (V3-glycan site, <b>HCDR3-dominant<\/b> — i.e. the normal, hard case, with a naive precursor frequency of<\/p>\n<p>about <b>1 in 50 million<\/b>, ~500× rarer): trial <b>HVTN 144<\/b> with immunogen N332-GT5 plus the SMNP adjuvant —<\/p>\n<p><b>&gt;92% of recipients responded to a single bolus vaccination<\/b>, with cryo-EM confirming the BG18 binding mode.<\/p>\n<p><b>And the headline<\/b>: a <i>Nature<\/i> paper this summer in non-human primates — an escalating-dose prime plus **seven<\/p>\n<p>boosts<b> — produced <\/b>broadly neutralising antibodies in serum**, not just in sorted memory B cells. The best animal<\/p>\n<p>reached <b>&gt;80% breadth<\/b> relative to BG18 on a 100+ pseudovirus panel, at a potency corresponding to roughly 90%<\/p>\n<p>protection. He was careful: <i>&quot;this is not yet a vaccine.&quot;<\/i><\/p>\n<h4>The safety signal worth noting<\/h4>\n<p>Two studies of his immunogens <b>delivered by RNA<\/b> had an unexpectedly high incidence of **adverse skin reactions<\/p>\n<p>and urticaria, 6.5–11.7%** — far above Moderna&#x27;s non-HIV RNA vaccines. His own reading is that it points to the<\/p>\n<p><b>HIV antigens themselves<\/b> rather than the RNA platform. An ongoing trial (<b>IAVI G004<\/b>, South Africa) is testing<\/p>\n<p><b>lower RNA doses<\/b>; as of late August, &gt;91% of participants had completed vaccination with no safety concerns in<\/p>\n<p>the blinded data.<\/p>\n<h4>The one exchange relevant to this audience<\/h4>\n<p>Asked whether vaccination could be combined with <b>B-cell editing<\/b> (referencing Alessio Nahmad and Justin Taylor<\/p>\n<p>earlier in the congress), he confirmed two collaborators — <b>Michel Nussenzweig and James Voss<\/b> — are independently<\/p>\n<p>editing B cells to carry bNAb or bNAb-precursor genes, then vaccinating to drive maturation and conversion to<\/p>\n<p>plasma cells. <b>Nussenzweig is pushing the same idea with stem cells.<\/b> He is also interested in this for <b>therapy<\/b><\/p>\n<p>in people on ART, not only prevention.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day1_Tue/INV03_Schief.md", "followups": [], "rating": 2}, {"id": "INV04", "date": "2026-10-27", "time": "16:00", "speaker": "Michel Sadelain", "affiliation": "Columbia Institute for Cell Engineering and Therapy (CICET), New York, NY", "title": "Origins and Evolution of Chimeric Antigen Receptors", "authors": "", "session": "SESSION 1: ESGCT 2026 Opening: Clinical applications of gene therapy", "hall": "Hall 1", "chairs": "Alberto Auricchio; Zoltan Ivics; Boris Fehse", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": true, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "15:59", "dur": 38.4, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV05", "date": "2026-10-27", "time": "17:00", "speaker": "Mario Mietzsch", "affiliation": "", "title": "Structural characterization of the AAV capsid interactome", "authors": "M Mietzsch; M Gulkis; J Hsi-Bell; J Zachary; J Heidings; A Bennett; J Bird; J Huiskonen; G Logan; I Alexander; R McKenna", "session": "SESSION 2a: AAVs/Non integrative vectors I - Basic", "hall": "Hall 1", "chairs": "Isabelle Richard; Anna Marei Mann", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV06", "date": "2026-10-27", "time": "17:30", "speaker": "Silvana Libertini", "affiliation": "Novartis", "title": "Investigating DNA damage response and viral integration in rAAV-transduced primary human hepatocytes", "authors": "", "session": "SESSION 2a: AAVs/Non integrative vectors I - Basic", "hall": "Hall 1", "chairs": "Isabelle Richard; Anna Marei Mann", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV07", "date": "2026-10-27", "time": "17:00", "speaker": "Jacob Giehm Mikkelsen", "affiliation": "Aarhus University", "title": "Prime editing in hematopoietic stem cells for correction of GATA2 deficiency – from all-RNA nucleofection to RNP delivery using lentivirus-derived VLPs", "authors": "", "session": "SESSION 2b: (Epi)genome editing I", "hall": "Hall G", "chairs": "Frank Buchholz; Guillermo Montoya", "topic": "Genome editing", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": true, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "17:11", "dur": 27.0, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "A direct comparison of RNP plus AAV6 HDR against prime editing in GATA2-deficiency patient HSPCs. HDR gave higher editing but markedly fewer colonies, lower proliferation, poorer engraftment and extensive target-site deletions; prime editing was less efficient but far better tolerated, and the speaker attributed part of that to the RNA nucleofection itself rather than only to avoiding a double-strand break. PE7 raised efficiency substantially. Cutting pre-stimulation from 72 to under 24 hours -- on the logic that the long window exists to drive cycling for HDR -- improved colony formation, chimerism and editing maintained at 16 weeks. Separately, paired nickase architecture eliminated translocations by CAST-Seq while reducing p53 activation; and for lentivirus-derived particles, protease cleavage sites with proline in the first position after the cut released cargo best, while a BaEV pseudotype substantially outperformed VSV-G for entry into stem cells.", "summary": "<h3>INV07 · Prime editing in HSCs for GATA2 deficiency — from all-RNA nucleofection to RNP delivery by lentivirus-derived VLPs<\/h3>\n<p><b>Jacob Giehm Mikkelsen<\/b>, Aarhus University · Tue 27 Oct, 17:00, Hall G (Session 2b, (Epi)genome editing I)<\/p>\n<p>Source: full transcript (<code>Transcripts/inv07 hsc gata.txt<\/code>) + 27-min recording · starts a few minutes in<\/p>\n<h4>The core comparison: HDR wins on efficiency, loses on everything else<\/h4>\n<p>In GATA2-deficiency patient HSPCs:<\/p>\n<table class=\"sumtab\"><thead><tr><th><\/th><th>RNP + AAV6 HDR<\/th><th>Prime editing (PEmax, then PE7)<\/th><\/tr><\/thead><tbody><tr><td>Editing efficiency<\/td><td><b>higher<\/b><\/td><td>lower<\/td><\/tr><tr><td>CFU colony formation<\/td><td><b>much fewer colonies<\/b><\/td><td>roughly as expected<\/td><\/tr><tr><td>Proliferation<\/td><td>lower<\/td><td>higher<\/td><\/tr><tr><td>Engraftment / human chimerism in mice<\/td><td><b>less engraftment<\/b><\/td><td>better<\/td><\/tr><tr><td>Editing in the cells that did engraft<\/td><td>still higher<\/td><td>lower<\/td><\/tr><tr><td>Deletions at the target site<\/td><td><b>massive<\/b><\/td><td>small deletions, substitutions, a few indels<\/td><\/tr><\/tbody><\/table>\n<p>His own summary: *&quot;prime editing is less efficient than HDR, but seemed to be better tolerated in the cells — not<\/p>\n<p>just the prime editing approach, but the RNA nucleofection itself.&quot;* That last clause matters: part of the benefit<\/p>\n<p>is dropping AAV, not just dropping the double-strand break.<\/p>\n<p><b>Then PE7 arrived<\/b> (David Liu&#x27;s lab) and lifted prime editing efficiency in HSCs substantially, along with GATA2<\/p>\n<p>expression — which is what made the rest of the work viable.<\/p>\n<h4>The protocol change worth copying immediately<\/h4>\n<p><b>Pre-stimulation cut from 72 h to under 24 h.<\/b> The rationale is clean: *you need 72 h of pre-stimulation to get<\/p>\n<p>cells cycling for HDR; you do not need it for prime editing.* Results of the shorter window:<\/p>\n<ul>\n<li>prime editing stayed high<\/li>\n<li><b>better CFU<\/b> — they stopped seeing the exhaustion that 72 h produced<\/li>\n<li><b>much higher chimerism<\/b> on engraftment, approaching healthy-donor levels (untreated GATA2 HSPCs engraft poorly)<\/li>\n<li><b>higher maintained editing at 16 weeks<\/b>, so a robust increase in corrected alleles recovered from bone marrow<\/li>\n<\/ul>\n<p>In the Q&amp;A someone asked why there was still a 2-day culture between editing and injection; he conceded it was<\/p>\n<p>protocol inertia — <i>&quot;there is probably no need to do it.&quot;<\/i><\/p>\n<h4>Also in the talk<\/h4>\n<ul>\n<li><b>Paired nickase<\/b> (earlier HDR work): reduced p53 activation, raised CFU relative to standard Cas9, and drove<\/li>\n<\/ul>\n<p>off-targets to near zero. <b>CAST-Seq showed translocations eliminated<\/b> — standard Cas9 with that guide produced<\/p>\n<p>a fair number, HiFi Cas9 fewer, paired nickase none. Proof that therapeutic HDR is possible without off-target<\/p>\n<p>cleavage or translocations.<\/p>\n<ul>\n<li><b>pegRNA design is brute force and luck.<\/b> Best pegRNA here: <b>13 nt primer binding site, 21 nt RT template<\/b>,<\/li>\n<\/ul>\n<p>found by screening a panel; nicking guides added on top; ~5 µg prime-editor mRNA plus synthetic pegRNA for HSPCs.<\/p>\n<p>Asked whether the optimisation transfers to another gene: *&quot;we have targets where we&#x27;ve designed like a million<\/p>\n<p>pegRNAs and didn&#x27;t get a result.&quot;*<\/p>\n<ul>\n<li><b>Functional rescue<\/b> confirmed against GATA2-regulated haematopoietic programmes — knockout and correction move<\/li>\n<\/ul>\n<p>the same genes in opposite directions (CD133 among them), and prime editing does nothing in healthy-donor cells,<\/p>\n<p>as it should.<\/p>\n<ul>\n<li><b>Twin prime + Bxb1 one-pot cDNA insertion<\/b>: twin pegRNAs install an attP site, Bxb1 recombinase then inserts an<\/li>\n<\/ul>\n<p>exon 4–6 cDNA donor delivered on AAV. Numbers modest. Upstream junction precise; downstream junction messy but<\/p>\n<p>outside the ORF. Some background insertion without the recombinase that they cannot yet explain.<\/p>\n<h4>The delivery half — LVNPs<\/h4>\n<p>Lentivirus-derived nanoparticles: editor fused to Gag (they now favour the Gag C-terminus), guide RNA overexpressed<\/p>\n<p>in producer cells so an <b>RNP assembles inside the budding particle<\/b>, then matures and releases. Their lineage:<\/p>\n<p>ZFNs in 2014, TALENs, <b>Cas9 in 2016<\/b>; they can also deliver an HDR donor as a vector RNA that reverse-transcribes<\/p>\n<p>into a double-stranded donor.<\/p>\n<p>Two optimisation findings that generalise:<\/p>\n<p>1. <b>Protease cleavage site choice is decisive, and there is a rule.<\/b> Screening a panel of PCS sequences, the ones<\/p>\n<p>with <b>a proline in the first position after the cut<\/b> supported the highest editing. The logic is a balance —<\/p>\n<p>no premature cleavage in the producer cell, efficient release from Gag after budding. *This is the same<\/p>\n<p>maturation-is-make-or-break point Cavazza made in EDU07, now with an actual sequence rule attached.*<\/p>\n<p>2. <b>PE7 beats PEmax in particles for a non-obvious reason.<\/b> With PEmax they had to add extra editor to the<\/p>\n<p>recipient cells to get activity; with PE7 they did not, because **the pegRNA appears protected from<\/p>\n<p>degradation**. PE-LVNP went from almost no editing (1.0) to ~100% in culture (2.0).<\/p>\n<p><b>And the pseudotype result that matters for HSPCs:<\/b> VSV-G gave <i>low<\/i> editing in stem cells;<\/p>\n<p><b>BaEV (baboon endogenous retrovirus) pseudotype<\/b> gave efficient entry, proper prime-editing levels, and good<\/p>\n<p>colony formation. PE-LVNP 2.0 + BaEV is his platform claim for stem-cell prime editing, with in vivo ambitions.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day1_Tue/INV07_Mikkelsen.md", "followups": [], "rating": 5}, {"id": "INV08", "date": "2026-10-27", "time": "17:30", "speaker": "Angelo Lombardo", "affiliation": "SR-Tiget, Milan", "title": "Programming Durable Gene Silencing by Targeted Epigenetic Editing", "authors": "", "session": "SESSION 2b: (Epi)genome editing I", "hall": "Hall G", "chairs": "Frank Buchholz; Guillermo Montoya", "topic": "Genome editing", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": true, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "17:38", "dur": 28.3, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV09", "date": "2026-10-27", "time": "17:00", "speaker": "Dimitrios Wagner", "affiliation": "Baylor College of Medicine & Charité / Berlin Institute of Health", "title": "Engineering CAR T cells by targeted integration – and taking it in vivo", "authors": "", "session": "SESSION 2c: Immunotherapy and CAR T cells I", "hall": "Hall 3", "chairs": "Bernhard Gentner; Michael Hudecek", "topic": "CAR-T & immunotherapy", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": diseases / vaccines", "hall": "Hall G", "chairs": "Carmen Elena Gomez; Kristie Bloom", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV26", "date": "2026-10-28", "time": "11:00", "speaker": "He Huang", "affiliation": "", "title": "Functional Optimization,Transplant Integration, and Indication Expansion of CAR-T Cell Therapy", "authors": "H Huang", "session": "SESSION 4c: Immunotherapy and CAR T cells II", "hall": "Hall 3", "chairs": "Waseem Qasim; Sonia Guedan", "topic": "CAR-T & immunotherapy", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV27", "date": "2026-10-28", "time": "11:30", "speaker": "Andreas Mackensen", "affiliation": "University Hospital of Erlangen", "title": "Can CAR-T cells cure autoimmune disease?", "authors": "", "session": "SESSION 4c: Immunotherapy and CAR T cells II", "hall": "Hall 3", "chairs": "Waseem Qasim; Sonia Guedan", "topic": "CAR-T & immunotherapy", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "INV28", "date": "2026-10-28", "time": "11:00", "speaker": "Samantha Ginn", "affiliation": "", "title": "Defining Therapeutic Genome Editing Outcomes in the Liver", "authors": "S Ginn", "session": "SESSION 4d: Metabolic diseases II", "hall": "Hall 4", "chairs": "Matthew Porteus; Maria Ester Bernardo", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "11:03", "dur": 28.9, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Homology-independent targeted integration (HITI) for OTC deficiency in the liver, chosen because it is cell-cycle independent and mutation agnostic -- one reagent set for all OTC variants, trading the precision of base or prime editing for coverage. A promoterless donor is targeted into the large first intron of OTC and captures the native promoter, restoring physiological expression. Models run from an SPF-ash mouse through FRG mice carrying patient-derived human hepatocytes to whole human livers on extracorporeal perfusion. The notable result: long-read whole-genome sequencing at the target locus showed the clean integration event was a minority. Free ITRs cleaved from the vector compete for the cut site, AAV concatemers up to about 15 kb with four intact cassettes are common, and the nuclease-delivery vector was also found integrated. Those concatemers are frequently functional, since one correctly oriented cassette suffices -- which the speaker suggested partly explains the high apparent efficiency.", "summary": "<h3>INV28 · Defining therapeutic genome editing outcomes in the liver<\/h3>\n<p><b>Samantha Ginn<\/b>, Children&#x27;s Medical Research Institute, Sydney · Wed 28 Oct, 11:00, Hall 4 (Session 4d, Metabolic diseases II)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-28_11_03_29_inv28_hiti_in_liver trasncript.txt<\/code>) + 25-min recording incl. Q&amp;A<\/p>\n<h4>Why they edit rather than add<\/h4>\n<p>Paediatric liver gene therapy has a dilution problem: the liver roughly doubles in size by three months, again by<\/p>\n<p>two years, again by nine. Their own earlier data make it concrete — a simple AAV gene-addition vector with a GFP<\/p>\n<p>reporter gives <b>lifelong stable expression in an adult mouse<\/b>, but delivered to a two-to-three-day-old pup, by<\/p>\n<p>three weeks you see <b>rapid clearance of AAV episomes leaving small clusters of stable AAV integration<\/b>.<\/p>\n<p>Three models, in increasing clinical relevance:<\/p>\n<ul>\n<li><b>SPF-ash mouse<\/b> — an OTC splicing mutation, mild phenotype, with urinary orotic acid as a correction read-out<\/li>\n<li><b>FRG mice engrafted with patient-derived primary human hepatocytes<\/b> — chimeric human livers, so human-specific<\/li>\n<\/ul>\n<p>reagents <i>and<\/i> capsid performance can be tested in human cells in vivo<\/p>\n<ul>\n<li><b>Whole human livers maintained on extracorporeal perfusion circuits<\/b> — newer, and their route to preclinical<\/li>\n<\/ul>\n<p>translation in a human organ<\/p>\n<h4>The strategy<\/h4>\n<p><b>HITI<\/b> — homology-independent targeted integration — chosen for two reasons worth noting:<\/p>\n<ul>\n<li>it is <b>cell-cycle independent<\/b>, so it does not depend on hepatocyte replication, and<\/li>\n<li>it is <b>mutation agnostic<\/b>: one reagent set for all OTC mutations. She was explicit about the trade: less precise<\/li>\n<\/ul>\n<p>than base or prime editing, which correct a single variant, but every patient can be treated with the same reagents.<\/p>\n<p>Design: a <b>promoterless<\/b> donor cassette on AAV, targeted deep into the <b>large first intron of OTC<\/b> to avoid<\/p>\n<p>disrupting coding sequence. Cas9 releases the donor from the AAV genome and cuts the intron; expression then<\/p>\n<p>depends on <b>capturing the native OTC promoter<\/b>, restoring physiological regulation. Delivery by dual AAV or by<\/p>\n<p>AAV donor plus <b>LNP-delivered Cas9<\/b>, with LNP preferred so nuclease expression is transient and no extra<\/p>\n<p>promoter or enhancer elements are introduced.<\/p>\n<h4>What long-read whole-genome sequencing actually found<\/h4>\n<p>This is the part to take away. <b>The desired clean integration was a minority of events.<\/b> Alongside it:<\/p>\n<ul>\n<li><b>Free ITRs<\/b>, cleaved out of the AAV vector by the nuclease, integrated at the cut site — common, and they<\/li>\n<\/ul>\n<p><b>compete<\/b> with the intended event.<\/p>\n<ul>\n<li><b>Very large concatemers<\/b> of AAV — one example around **15 kb containing at least four intact expression<\/li>\n<\/ul>\n<p>cassettes**.<\/p>\n<ul>\n<li><b>Integration of the Cas9 vector itself<\/b>, delivered by LNP — and in her words they <b>&quot;found [it] always&quot;<\/b>.<\/li>\n<\/ul>\n<p>That would give long-term, permanent Cas9 expression, which undercuts the whole safety rationale for choosing<\/p>\n<p>LNP in the first place.<\/p>\n<ul>\n<li><b>But the concatemers are frequently functional.<\/b> Because of the splice-donor/splice-acceptor configuration,<\/li>\n<\/ul>\n<p><b>one cassette in the correct orientation is enough<\/b> for a functional outcome — which she thinks is part of why<\/p>\n<p>the efficiency looked so high.<\/p>\n<p>Her framing of the background: *&quot;it&#x27;s been known for a really long time that AAV will integrate into double<\/p>\n<p>stranded breaks&quot;* — shown two decades ago — so introducing a nuclease should be expected to increase it. What is<\/p>\n<p>new is that more sophisticated sequencing is now revealing the long concatemers.<\/p>\n<p><b>Conclusions as she gave them:<\/b> unprecedented levels of highly specific targeted integration and functional<\/p>\n<p>correction in liver; a very complex integration pattern at the target locus; concatemers still deliver therapeutic<\/p>\n<p>benefit in this model; cleaved ITRs compete and removing them from the vector would improve integration; dual AAV<\/p>\n<p>limits nuclease exposure; reducing vector dose reduces competition. Published last month, with the cover image.<\/p>\n<h4>Q&amp;A worth keeping<\/h4>\n<ul>\n<li><b>On random integration:<\/b> the donor is promoterless, so to be expressed it must land behind an active promoter<\/li>\n<\/ul>\n<p>and splice into it. Checking unexpected splicing, they **did see human albumin and alpha-1 antitrypsin promoters<\/p>\n<p>captured** by GFP-containing transcripts — strong endogenous promoters competing as capture sites.<\/p>\n<ul>\n<li><b>Guide RNA in AAV versus LNP:<\/b> with <b>SaCas9<\/b> the guide <b>did not tolerate highly modified loop structures<\/b>,<\/li>\n<\/ul>\n<p>so end modification worked but higher doses were needed. With <b>SpCas9<\/b>, integration levels were similar whether<\/p>\n<p>the guide came by LNP or AAV — provided the highly modified guide structure was right.<\/p>\n<ul>\n<li><b>Genome-wide:<\/b> they do not see the very long concatemers elsewhere in the genome at the same rate.<\/li>\n<li><b>Polyploid hepatocytes:<\/b> multinucleated cells show higher positivity — editing one genome in a multinucleated<\/li>\n<\/ul>\n<p>cell makes the cell positive. **No evidence of chromosomal rearrangements, but she was candid that they have not<\/p>\n<p>looked extensively.**<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day2_Wed/INV28_Ginn.md", "followups": [], "rating": 5}, {"id": "INV29", "date": "2026-10-28", "time": "11:30", "speaker": "Gloria Gonzalez-Aseguinolaza", "affiliation": "CIMA, University of Navarra, Pamplona", "title": "Correction of Metabolic Liver Diseases by AAV liver Gene Editing and its molecular implications", "authors": "", "session": "SESSION 4d: Metabolic diseases II", "hall": "Hall 4", "chairs": "Matthew Porteus; Maria Ester Bernardo", "topic": "Disease areas (CNS, metabolic, muscle, skin…)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "11:32", "dur": 23.9, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "", "summary": "", "summary
