ESSION 3a: AAVs/non integrative vectors II - Technology", "hall": "Hall 1", "chairs": "Nerea Zabaleta Lasarte; Paula Sureda Horrach", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR017", "date": "2026-10-28", "time": "10:00", "speaker": "Xabier Perez Garmendia", "affiliation": "", "title": "In vivo targeting of hematopoietic stem cells by capsid-engineered AAV vectors", "authors": "X Perez Garmendia; N Meumann; S Radtke; S Just; A Fornell Gutierrez; M Ertelt; C Schoeder; A Kuhlmann; C Peterson; B Ollala; M Rhiel; M Whitehead; T Cornu; C Mussolino; P Rio; H Kiem; H Büning", "session": "SESSION 3a: AAVs/non integrative vectors II - Technology", "hall": "Hall 1", "chairs": "Nerea Zabaleta Lasarte; Paula Sureda Horrach", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR018", "date": "2026-10-28", "time": "10:15", "speaker": "Jan Bieri", "affiliation": "", "title": "Erythroid progenitor-specific gene delivery using an adaptable AAV targeting system", "authors": "J Bieri; N Ammann; C Ros; D Grimm", "session": "SESSION 3a: AAVs/non integrative vectors II - Technology", "hall": "Hall 1", "chairs": "Nerea Zabaleta Lasarte; Paula Sureda Horrach", "topic": "Viral vectors (AAV / Lenti / Adeno)", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR019", "date": "2026-10-28", "time": "09:30", "speaker": "Stefano Gritti", "affiliation": "", "title": "Patient-specific gene editing approaches rescue B cell development in X-linked agammaglobulinemia", "authors": "S Gritti; S Moula; T Whittaker; N White; M Larcombe; E Davis; A Thrasher; C Booth; G Santilli", "session": "SESSION 3b: Hematopoietic & PID", "hall": "Hall G", "chairs": "Giorgia Santilli; Daniel Bauer", "topic": "HSC & hematopoietic", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "09:31", "dur": 17.3, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Base and prime editing for patient-specific BTK variants in X-linked agammaglobulinemia, after an earlier Cas9 plus cDNA HDR approach lost engraftment and showed two intronic off-targets. Adenine base editing reverted 70-80% of reads, half of them precise with no bystander editing; prime editing reached about 30% with minimal indels. Clonogenic output was maintained. At 13 weeks in NSG mice there was no engraftment penalty and no skewing of the most primitive HSC subpopulations, CD19+ progenitors were restored, the pro-B block relieved, and mature recirculating B cells -- entirely absent in untreated patient cells -- returned near wild-type levels, with KREC copy number and plasma IgM both up. Useful thresholds: around 5% wild-type cells restores B-cell ontogeny in mouse competition, and patients at 50% or below mixed chimerism have come off immunoglobulin replacement.", "summary": "<h3>OR019 · Patient-specific gene editing approaches rescue B cell development in X-linked agammaglobulinemia<\/h3>\n<p><b>Stefano Gritti<\/b>, University College London (Santilli lab, GOSH) · Wed 28 Oct, 09:30, Hall G (Session 3b, Hematopoietic &amp; PID)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-28_09_31_06_or19_ucl_xla transcript.txt<\/code>) + 17-min recording<\/p>\n<h4>Why they moved off HDR<\/h4>\n<p>Their previous published approach: Cas9 double-strand break in an early <i>BTK<\/i> exon plus a corrective BTK cDNA<\/p>\n<p>knock-in. It rescued the phenotype in vitro and in immunodeficient mice, <b>but<\/b>:<\/p>\n<ul>\n<li><b>decreased cellular engraftment after editing<\/b>, and<\/li>\n<li><b>two off-target cleavage events<\/b> detected (both intronic)<\/li>\n<\/ul>\n<p>— which together blocked translation. So in parallel with the nonviral-template work, they asked whether<\/p>\n<p><b>base and prime editing<\/b> could fix patient-specific variants without a double-strand break or any template at all.<\/p>\n<h4>The result<\/h4>\n<p>Target: a C&gt;T substitution creating a premature stop in <b>exon 15 of BTK<\/b>, in CD34⁺ HSPCs from an adult XLA patient.<\/p>\n<p>Tools: <b>SpRY (PAM-relaxed) adenine base editor<\/b> and <b>PE7<\/b>.<\/p>\n<ul>\n<li><b>Base editing: 70–80% of reads carried the T&gt;C reversion, 50% of them precise<\/b> with no silent or missense bystander edits.<\/li>\n<li><b>Prime editing: ~30% average<\/b>, minimal indels or pegRNA scaffold incorporation.<\/li>\n<li>Prime-editing efficiency was raised by adding <b>silent mutations in the RT template to evade mismatch repair<\/b><\/li>\n<\/ul>\n<p>(v1→v3 escalating), and by a <b>secondary nicking guide (PE3, position −54)<\/b>.<\/p>\n<ul>\n<li><b>Clonogenic output was maintained<\/b> with both — explicitly in contrast to their unoptimised HDR approach.<\/li>\n<\/ul>\n<p>Functionally, in a feeder-free B-cell differentiation protocol (IL-6/IL-7 then autonomous proliferation on<\/p>\n<p>ICAM-1-coated plates): increased immature B cells, <b>BTK RNA up 5-fold (BE) and 3-fold (PE)<\/b>, protein rescued.<\/p>\n<p><b>NSG engraftment at 13 weeks<\/b> — the part that matters most:<\/p>\n<ul>\n<li><b>no decrease in engraftment<\/b> versus unmanipulated patient cells, for either modality<\/li>\n<li><b>no skewing of the most primitive HSC subpopulations<\/b> within the graft<\/li>\n<li>CD19⁺ B-cell progenitors restored; the pro-B block relieved, shifting the distribution to pre-B1 and later<\/li>\n<li>in spleen, the **mature recirculating B-cell phenotype — entirely absent in untreated patient cells — restored<\/li>\n<\/ul>\n<p>near wild-type levels**<\/p>\n<ul>\n<li>correction percentage largely maintained through 13 weeks, byproducts still low<\/li>\n<li><b>KREC<\/b> (kappa recombination excision circles, an assay borrowed from their GOSH clinical colleagues) increased<\/li>\n<\/ul>\n<p>significantly, and <b>plasma IgM rose significantly<\/b> in treated mice<\/p>\n<h4>The threshold question — useful numbers<\/h4>\n<p>Asked how much correction would be needed clinically, he gave two anchors:<\/p>\n<ul>\n<li>mouse competitive repopulation (wild-type vs BTK-mutant HSPCs at varying ratios): **as little as 5% wild-type<\/li>\n<\/ul>\n<p>cells restores B-cell ontogeny**<\/p>\n<ul>\n<li>human allo-HSCT experience: patients with **mixed chimerism around 50% or below are off immunoglobulin<\/li>\n<\/ul>\n<p>replacement** after 1–2 years of follow-up<\/p>\n<p>Results were <b>bulk, not sorted<\/b> for correction. Genotoxicity work is ongoing — in silico off-target nomination<\/p>\n<p>plus <b>multiplex rhAmpSeq<\/b> across the guides and pegRNAs, not yet analysed. A <b>single-cell RNA-seq dataset<\/b> is<\/p>\n<p>in hand comparing XLA versus healthy HSCs and across treatment modalities.<\/p>\n<p>On regulatory extensibility to other XLA mutations, he pointed at MHRA precedent from **personalised cancer<\/p>\n<p>vaccines<b>, the US n-of-1 work, and recent <\/b>ARPA-H funding that includes inborn errors of immunity** — while<\/p>\n<p>noting each patient switch would need extensive re-characterisation of the components.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day2_Wed/OR019_Gritti.md", "followups": [], "rating": 5}, {"id": "OR020", "date": "2026-10-28", "time": "09:45", "speaker": "Beatriz Olalla-Sastre", "affiliation": "", "title": "Prime editing-driven correction of Fanconi anemia mutations in human HSPCs", "authors": "B Olalla-Sastre; L García-García; L Ugalde; S Siegner; S Ammann; I Peña; L Alvarez; L Martínez de la Cal; M Pérez; M Mataix; D Mazzeo; M Karasu; T Cathomen; J Bueren; J Corn; P Río", "session": "SESSION 3b: Hematopoietic & PID", "hall": "Hall G", "chairs": "Giorgia Santilli; Daniel Bauer", "topic": "HSC & hematopoietic", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "09:48", "dur": 12.5, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Prime editing for Fanconi anemia, extending beyond the single complementation group covered by lentiviral gene therapy and preserving endogenous expression regulation. PE3 corrected about 40% of alleles in a patient lymphoblastoid line with full phenotypic rescue -- mitomycin C resistance, FANCA protein and FANCD2 monoubiquitination. In healthy-donor CD34+ cells efficiency went from 17% to 30% with improved in vitro transcription and to 40% with a second electroporation, though the second round gave no long-term benefit and was dropped. Primary and secondary NSG transplants showed no engraftment penalty and precise edits across all subpopulations including the most primitive. Patient mobilised peripheral blood reached 28% correction, translating to about 80% recovery of mitomycin C resistance in colony assays. The speaker noted electroporation is too toxic to translate as-is, and that genotoxicity studies have not yet been done.", "summary": "<h3>OR020 · Prime editing-driven correction of Fanconi anemia mutations in human HSPCs<\/h3>\n<p><b>CIEMAT / CIBERER / IIS-FJD, Madrid — Paula Río&#x27;s team<\/b> · Wed 28 Oct, 09:45, Hall G (Session 3b)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-28_09_48_27_or20_fanconi_ciemat transcript.txt<\/code>) + 12-min recording<\/p>\n<p>This is the CIEMAT group — the one whose cssDNA poster (<b>P0972<\/b>) is top of your Thursday list, and whose PI<\/p>\n<p>chairs Session 6 tonight.<\/p>\n<h4>What they did<\/h4>\n<p>Fanconi anemia: 23 genes in the FA/BRCA interstrand-crosslink repair pathway; chromosomal instability, congenital<\/p>\n<p>abnormalities, cancer predisposition, early progressive bone marrow failure. Their existing lentiviral gene therapy<\/p>\n<p>covers <b>FANCA<\/b> only. Prime editing is their route to <b>all 23 complementation groups<\/b>, and — the point she<\/p>\n<p>stressed — correcting the endogenous gene <b>preserves native expression regulation<\/b>, which matters for some FA<\/p>\n<p>groups.<\/p>\n<p>A nice framing problem they had to answer first: <i>can you prime-edit a DNA-repair-deficient cell at all?<\/i><\/p>\n<p><b>Patient lymphoblastoid line, PE3 (prime-editor mRNA + pegRNA + nicking guide):<\/b><\/p>\n<ul>\n<li><b>~40% of alleles corrected<\/b> by NGS at a premature-stop FANCA mutation<\/li>\n<li>corrected cells showed <b>proliferative advantage<\/b> over time<\/li>\n<li><b>mitomycin C resistance recovered<\/b> to healthy-donor levels<\/li>\n<li>FANCA protein and <b>FANCD2 monoubiquitination<\/b> restored — the pathway works again<\/li>\n<\/ul>\n<p><b>Healthy-donor CD34⁺ (cord blood / mPB), control edit, stepwise optimisation:<\/b><\/p>\n<ul>\n<li>17% → <b>30%<\/b> after improving the in vitro transcription of the editor mRNA → <b>40%<\/b> with a second<\/li>\n<\/ul>\n<p>electroporation round<\/p>\n<p><b>NSG primary and secondary transplant, monthly BM aspiration:<\/b><\/p>\n<ul>\n<li><b>engraftment not impaired<\/b> versus control cells<\/li>\n<li>high editing efficacy retained — <i>&quot;which we did not achieve with other strategies previously, such as HDR&quot;<\/i><\/li>\n<li>**precise prime-editing events in every sorted subpopulation of secondary recipients, including the most<\/li>\n<\/ul>\n<p>primitive HSPC**<\/p>\n<ul>\n<li><b>the second electroporation round did not help long-term<\/b> even though it helped in vitro — so they dropped back<\/li>\n<\/ul>\n<p>to one round. <i>A clean example of an in-vitro gain that does not survive transplant.<\/i><\/p>\n<p><b>Getting to patient cells.<\/b> FA patients have a reduced HSC reserve, so they built an **&quot;FA-like&quot; model by base<\/p>\n<p>editing the mutation INTO healthy CD34⁺** (~60% efficiency), then prime-edited to correct it (~22%). The pegRNA<\/p>\n<p>also installs a <b>silent mutation<\/b>, which both distinguishes prime-corrected from never-edited alleles and raises<\/p>\n<p>efficiency by evading mismatch repair.<\/p>\n<p><b>Real FA patient mobilised peripheral blood:<\/b> **~28% correction in liquid culture → ~80% recovery of mitomycin C<\/p>\n<p>resistance in CFU**, with ~80% of individually sequenced colonies carrying the FANCA correction — the genotype and<\/p>\n<p>phenotype numbers agree. Further enriched under MMC selection.<\/p>\n<h4>The limitation she volunteered<\/h4>\n<p>Annarita Miccio asked what delivery they envisage for such fragile cells. Answer, verbatim in substance:<\/p>\n<p>they use nucleofection, **&quot;we know this is quite toxic for the cells, they are pretty sensitive... we know that we<\/p>\n<p>cannot go further to patients using electroporation of the cells.&quot;** They are working on other delivery methods.<\/p>\n<p><b>No genotoxicity studies<\/b> have been done, even in primary cells — limited by cell numbers.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day2_Wed/OR020_Olalla-Sastre.md", "followups": [], "rating": 4}, {"id": "OR021", "date": "2026-10-28", "time": "10:00", "speaker": "Serena Scala", "affiliation": "", "title": "Biological properties and clonality of engineered hematopoietic stem/progenitor cells persisting longterm after gene therapy", "authors": "P Quaranta; G Pacini; L Seffin; L Basso-Ricci; F Benedicenti; S Giannelli; I Monti; C Perini; S Mazza; S Darin; F Tucci; F Ferrua; V Calbi; F Fumagalli; A Calabria; E Montini; M Bernardo; M Cicalese; A Aiuti; S Scala", "session": "SESSION 3b: Hematopoietic & PID", "hall": "Hall G", "chairs": "Giorgia Santilli; Daniel Bauer", "topic": "HSC & hematopoietic", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "10:03", "dur": 8.5, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Long-term fitness and clonality of engineered HSPCs in Wiskott-Aldrich and metachromatic leukodystrophy patients at 10 to 14 years after lentiviral gene therapy. HSPC counts, phenotypic HSC and the HSC/MPP/MLP composition of the primitive CD34+CD38- compartment were all stable against pre-treatment status; transduced colony frequency and vector copy number held to 10 years. Integration-site analysis showed consistent numbers across years with highly polyclonal engraftment and polyclonal output to all lineages, and patient CD34+ cells differentiated to all major lineages at healthy-donor rates. The group is now applying single-cell transcriptome plus ATAC with mitochondrial DNA variants for clonal tracing -- a method that does not require a vector integration site. Note: this recording is partial.", "summary": "<h3>OR021 · Biological properties and clonality of engineered HSPCs persisting long-term after gene therapy<\/h3>\n<p><b>Serena Scala<\/b>, SR-Tiget, Milan · Wed 28 Oct, 10:00, Hall G (Session 3b)<\/p>\n<p>Source: <b>partial<\/b> transcript — recording cut off mid-talk (<code>Transcripts/2026-10-28_10_03_47_or21_clonality partial transcript.txt<\/code>, ~8 min of ~15)<\/p>\n<h4>The setup<\/h4>\n<p>Her framing of the risk is the one that should worry anyone editing HSPCs: collection, ex vivo manipulation, then<\/p>\n<p><b>proliferative stress replacing a whole haematopoietic system<\/b> — which could plausibly cause **reduced clonality<\/p>\n<p>and premature ageing** of the compartment, especially since many of these patients were treated as young children.<\/p>\n<p>Two cohorts, both lentiviral:<\/p>\n<ul>\n<li><b>Wiskott–Aldrich syndrome<\/b> — WAS gene under its own promoter, gene-corrected cells have a selective advantage,<\/li>\n<\/ul>\n<p><b>reduced-intensity conditioning<\/b><\/p>\n<ul>\n<li><b>Metachromatic leukodystrophy<\/b> — no haematopoietic imbalance, but needs **supraphysiological transgene<\/li>\n<\/ul>\n<p>expression<b> to cross-correct non-haematopoietic tissue including brain, so <\/b>full myeloablation**.<\/p>\n<p>Current follow-up <b>more than 14 years<\/b>.<\/p>\n<p>Multi-layered read-out: phenotype, function, **single-cell multi-omics, and clonal tracing by mitochondrial DNA<\/p>\n<p>variants**.<\/p>\n<h4>What she showed before the recording cut<\/h4>\n<ul>\n<li><b>HSPC counts stable over time<\/b>, in line with pre-gene-therapy status, out to latest follow-up in both cohorts,<\/li>\n<\/ul>\n<p>with phenotypic HSC preserved.<\/p>\n<ul>\n<li>Within the most primitive <b>CD34⁺CD38⁻<\/b> compartment, <b>stable HSC / MPP / MLP composition<\/b> — self-renewal and<\/li>\n<\/ul>\n<p>differentiation capacity maintained.<\/p>\n<ul>\n<li><b>Stable gene correction<\/b>: consistent transduced-colony frequency and **vector copy number in CD34⁺ cells out to<\/li>\n<\/ul>\n<p>10 years**.<\/p>\n<ul>\n<li><b>Integration-site analysis across years: consistent numbers, highly polyclonal engraftment<\/b>, and polyclonal<\/li>\n<\/ul>\n<p>output to all lineages in both diseases.<\/p>\n<ul>\n<li><b>In vitro multilineage differentiation<\/b> of patient CD34⁺ over a 3-week culture produced lymphoid, erythroid,<\/li>\n<\/ul>\n<p>megakaryocyte and myeloid output <b>at rates comparable to healthy donors<\/b>.<\/p>\n<ul>\n<li>Now applying <b>Vijay Sankaran&#x27;s protocol<\/b> (single-cell transcriptome + ATAC + mtDNA variants for clonal tracing):<\/li>\n<\/ul>\n<p><b>5 MLD patients at &gt;8 years, ~20,000 cells<\/b>, integrated with Sankaran&#x27;s published Nature dataset.<\/p>\n<p>Result so far: <b>HSPC composition comparable to healthy donors<\/b>, with a substantial fraction retaining<\/p>\n<p>transcriptomic and epigenetic signatures of stemness.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day2_Wed/OR021_Scala.md", "followups": [], "rating": 4}, {"id": "OR022", "date": "2026-10-28", "time": "10:15", "speaker": "Kiriaki Paschoudi", "affiliation": "", "title": "In vivo HbF reactivation and selective erythroid enrichment using a novel adenoviral platform", "authors": "K Paschoudi; K Karuppusamy; A Anderson; A Velmurugan; E Arizani; C Theodorakoglou; M Giannaki; E Vlachaki; N Psatha; E Yannaki; A Lieber", "session": "SESSION 3b: Hematopoietic & PID", "hall": "Hall G", "chairs": "Giorgia Santilli; Daniel Bauer", "topic": "HSC & hematopoietic", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR023", "date": "2026-10-28", "time": "09:30", "speaker": "Iñaki Beasain", "affiliation": "", "title": "Preliminary results of a phase I trial evaluating DNX2440 oncolytic adenovirus in recurrent glioblastoma", "authors": "I Beasain; N Casares; C Li; M González; B Bejarano; J Fueyo; C Gómez; J Gállego; M Alonso", "session": "SESSION 3c: Oncolytic therapy & cancer gene therapy", "hall": "Hall 3", "chairs": "Anja Ehrhardt; Vincenzo Cerullo", "topic": "CAR-T & immunotherapy" kka Medert", "affiliation": "", "title": "Next-Generation Cancer Targeting: Harnessing CRISPR-Cas12a2 to Eliminate HPV-Positive Tumor Cells", "authors": "E Kleinert; R Medert; H Rebecca; T Fauth; P Scholz", "session": "SESSION 3c: Oncolytic therapy & cancer gene therapy", "hall": "Hall 3", "chairs": "Anja Ehrhardt; Vincenzo Cerullo", "topic": "CAR-T & immunotherapy", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR027", "date": "2026-10-28", "time": "09:30", "speaker": "Roberto Di Cunto", "affiliation": "", "title": "Advanced LAF-XP polyplexes for Non-Viral Delivery of mRNA to Retinal Photoreceptors", "authors": "R Di Cunto; E Weidinger; S Thalmayr; E Marrocco; J Seidl; E Wagner; A Auricchio", "session": "SESSION 3d: Non-viral vectors/ nanotechnology and RNA therapeutics I", "hall": "Hall 4", "chairs": "Helder Santos; Helena Florindo", "topic": "Non-viral, LNP & RNA", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR028", "date": "2026-10-28", "time": "09:45", "speaker": "Sophie Thalmayr", "affiliation": "", "title": "Hydrophobic Tuning and Surface Modification of Lipo-Xenopeptide mRNA Polyplexes in Different Cell Models In Vitro and In Vivo", "authors": "S Thalmayr; T Burghardt; J Müller; J Pöhmerer; M Yazdi; M Höhn; O Merkel; E Wagner", "session": "SESSION 3d: Non-viral vectors/ nanotechnology and RNA therapeutics I", "hall": "Hall 4", "chairs": "Helder Santos; Helena Florindo", "topic": "Non-viral, LNP & RNA", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR029", "date": "2026-10-28", "time": "10:00", "speaker": "Thomas Hansen", "affiliation": "Circio AB", "title": "circVec: A DNA Vector Platform Harnessing Intracellular Circular RNA Biogenesis for Next-Generation T Cell Therapies", "authors": "E O'Leary; J Zhang; F Akter; S Stefanelli; M Warsame; Y An; E Wiklund; V Levitsky; T Hansen", "session": "SESSION 3d: Non-viral vectors/ nanotechnology and RNA therapeutics I", "hall": "Hall 4", "chairs": "Helder Santos; Helena Florindo", "topic": "Non-viral, LNP & RNA", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [], "photos": [], "attended": false, "takeaway": "", "summary": "", "summary_file": "", "followups": [], "rating": 0}, {"id": "OR030", "date": "2026-10-28", "time": "10:15", "speaker": "Shinu John", "affiliation": "", "title": "Modified DNA: a new therapeutic modality for scalable, programmable, durable, and redosable genetic medicines", "authors": "C Breton; B Mead; C Brown; D Muralidharan; S Alves-Czachor; Y Tang; L Fajardo Brigido; P Grzesik; D Pezzulo; M Floyd; T Thurman; S Bhattacharya; M Zafferani; Y Hua; B Largey; M Dogan; M Mobley; T Reyes-Robles; K Kim; P Tavares; P Rivera-Pomales; J Stoute; J England; E Keen; X Zhang; l Helms; J Rubens; P Smith; S John; E Kennedy", "session": "SESSION 3d: Non-viral vectors/ nanotechnology and RNA therapeutics I", "hall": "Hall 4", "chairs": "Helder Santos; Helena Florindo", "topic": "Non-viral, LNP & RNA", "rel_terms": "", "relevance": "", "plan_note": "", "transcript": "", "has_transcript": false, "abstract": "", "plan": {}, "recs": [{"file": "", "start": "10:17", "dur": 15.3, "transcript": "", "confirm": false}], "photos": [], "attended": true, "takeaway": "Modified DNA as a non-viral modality, addressing two barriers: innate sensing by TLR9, cGAS and IFI16, and nuclear entry. Screening DNA topologies produced an immune-silent circular single-stranded form that nonetheless expressed roughly five-fold lower. Site-specific chemical modification of a single strand -- rather than both, which gave no usable balance -- recovered a far better frontier between cytokine induction and expression, verified by direct 2'3'-cGAMP measurement rather than cytokine proxies alone. In non-human primates unmodified DNA produced severe clinical signs requiring a second dose of dexamethasone, while the modified form resolved within 24 hours. A co-factor mRNA co-encapsulated with the DNA payload shuttles it into the nucleus and substantially boosts expression; mechanism undisclosed. Applications shown in liver expression and in vivo CAR-T, where the modified-DNA CAR controlled tumour through six rechallenges against one for mRNA.", "summary": "<h3>OR030 · Modified DNA: a new therapeutic modality for scalable, programmable, durable, redosable genetic medicines<\/h3>\n<p><b>Shinu John<\/b> — speaker says the company is <b>Senda<\/b> (the programme prints &quot;Serif Biomedics&quot;; treat the<\/p>\n<p>programme entry as suspect) · Wed 28 Oct, 10:15, Hall 4 (Session 3d, Non-viral vectors / RNA therapeutics I)<\/p>\n<p>Source: full transcript (<code>Transcripts/2026-10-28_10_17_12_or20_mod_dna transcript.txt<\/code>) + 15-min recording<\/p>\n<p>The talk frames DNA therapeutics as failing on two barriers: <b>innate immune sensing<\/b> and <b>nuclear entry<\/b>.<\/p>\n<h4>The sensing problem, and their answer<\/h4>\n<p>Sensors they name: <b>TLR9<\/b> in the endosome, <b>cGAS<\/b> and <b>IFI16<\/b> in the cytosol. Recognition → inflammation,<\/p>\n<p>translation shutdown, toxicity.<\/p>\n<p>They screened DNA topologies — linear, circular, various geometries — and landed first on **Mod DNA 1, a circular<\/p>\n<p>single-stranded DNA<b>. In primary fibroblasts it was <\/b>immune silent** where unmodified DNA produced high<\/p>\n<p>pro-inflammatory cytokines and chemokines. <b>But expression was about five-fold lower.<\/b> That trade-off is the<\/p>\n<p>whole talk.<\/p>\n<p>So they moved to <b>site-specific chemical modification<\/b>, plotting cytokine production against expression:<\/p>\n<ul>\n<li>modifying <b>both strands<\/b> → almost no hits with a usable balance<\/li>\n<li>modifying <b>only one strand<\/b> → a much better frontier. That is <b>Mod DNA 2.2<\/b>.<\/li>\n<\/ul>\n<p>Read-outs were proper mechanism, not proxies: <b>direct measurement of 2′3′-cGAMP<\/b>, the cGAS–STING second<\/p>\n<p>messenger, plus cytokine/chemokine panels, in primary fibroblasts and macrophages. Both modified forms gave little<\/p>\n<p>or no cGAMP. Expression ranks <b>unmodified &gt; Mod DNA 2.2 &gt; Mod DNA 1<\/b>.<\/p>\n<p><b>In vivo tolerability.<\/b> Rats: no LFT elevation; Mod DNA 1 immune silent, 2.2 minimal and transient.<\/p>\n<p><b>NHP is where the contrast is stark<\/b> — unmodified DNA caused **severe clinical signs persisting for days and<\/p>\n<p>requiring a second dose of dexamethasone<b>; Mod DNA 2.2 gave minimal signs resolving <\/b>within 24 h**, with<\/p>\n<p>cytokines back to baseline in the same window. Repeated with a larger cargo and a different construct: no clinical<\/p>\n<p>signs for either modified form.<\/p>\n<h4>The nuclear-entry half: &quot;co-factor mRNA&quot;<\/h4>\n<p>A transiently expressed protein, encoded by an mRNA <b>co-encapsulated with the DNA payload in one LNP<\/b>, whose main<\/p>\n<p>job is to <b>shuttle the DNA into the nucleus<\/b> — and which may also potentiate expression and modulate cell-specific<\/p>\n<p>entry. In rats with a Factor IX payload: mRNA gives a high peak then a precipitous drop; unmodified DNA alone is<\/p>\n<p>low; <b>DNA plus co-factor is substantially boosted<\/b>, confirmed by an RNase A experiment measuring FIX transcripts<\/p>\n<p>originating from the DNA. Mod DNA 2.2 maintained <b>durable expression to the end of study<\/b> where mRNA spiked and fell.<\/p>\n<p>Asked in Q&amp;A: the co-factor is <b>agnostic to DNA form<\/b> — circular or double-stranded. The mechanism, and whether<\/p>\n<p>it is sequence- or structure-specific, is <b>confidential<\/b>.<\/p>\n<h4>Applications shown<\/h4>\n<ul>\n<li><b>Liver<\/b> (hepatocytes, intracellular and secreted proteins) — the FIX work above.<\/li>\n<li><b>In vivo CAR-T.<\/b> Serial killing in vitro: mRNA-encoded CAR controls tumour on the first co-culture then is<\/li>\n<\/ul>\n<p>overgrown; <b>Mod DNA 2.2-encoded CAR controls through six rechallenges<\/b>. In a humanised CD34⁺ NSG model,<\/p>\n<p><b>two doses two weeks apart gave complete or near-complete B-cell depletion<\/b> in blood and tissues. It is<\/p>\n<p>episomal, so it dilutes out over time — which he presents as a feature (controllability).<\/p>\n<ul>\n<li>Positioning: viral CAR-T carries genotoxicity risk and no off-switch; mRNA needs repeated dosing and<\/li>\n<\/ul>\n<p><b>&quot;redosing doesn&#x27;t work in autoimmune patients&quot;<\/b> per emerging clinical data; modified DNA is the &quot;Goldilocks zone&quot;.<\/p>\n<p>Asked whether the modified DNA could serve as <b>a template for stable integration<\/b> — i.e. an HDR donor — he<\/p>\n<p>answered <b>&quot;it should be&quot;<\/b>, untested. No NHP expression-duration data yet; the NHP work so far is tolerability only.<\/p>\n<hr>\n<p><i>Written from a recording of the session. Speaker names and affiliations follow the published programme; any figure read off a slide should be checked against the original.<\/i><\/p>", "summary_file": "Summaries/Day2_Wed/OR030_John_ModifiedDNA.md", "followups": [], "rating": 5}, {"id": "OR031", "date": "2026-10-28", "time": "12:00", "speaker": "Stylianos Michalakis", "affiliation": "", "title": "Clinical translation of a dual AAV gene therapy for ABCA4-associated Stargardt disease", "authors": "S Michalakis; J Chen; T Li; H Jia; V Splith; P Heyn; F Kynast; N Klippel; V Mehlfeld; E Becirovic; J Ren; C Haudenschild; X Sun; M Biel", "session": "SESSI  return `<div class="legend">Odd numbers presented Wed 13:30–15:30 · even numbers Thu 14:00–16:00. </div><div class="chips">${RANGES.map((r,i)=>`<span class="chip ${pr==r?'on':''}" data-r="${i}">${r[0]} P${String(r[1]).padStart(4,'0')}–${String(r[2]).padStart(4,'0')}</span>`).join('')}<span class="chip" data-r="x">all</span> <span class="chip ${psort=='rel'?'on':''}" data-s="rel">sort: relevance</span><span class="chip ${psort=='id'?'on':''}" data-s="id">sort: number</span></div>
 <table><thead><tr><th style="width:70px">#</th><th style="width:44%">Poster</th><th>Matched terms</th><th style="width:70px">Day</th></tr></thead><tbody>${ps.slice(0,400).map(p=>`<tr class="clk" data-p="${p.id}"><td><b>${p.id}</b>${p.star?' <span class="b star">★</span>':''}</td><td>${esc(p.title)}<div class="muted">${esc(p.authors.slice(0,140))}</div>${p.note?`<div><b>Note:</b> ${esc(p.note)}</div>`:''}</td><td class="muted">${esc(p.terms.join(', '))}</td><td>${(+p.id.slice(1))%2?'Wed':'Thu'}</td></tr>`).join('')}</tbody></table>${ps.length>400?`<p class="muted">Showing 400 of ${ps.length} — search or pick a range.</p>`:''}`}
function inbox(){if(!D.inbox.length)return '<p class="muted">Nothing to confirm. New recordings/photos that could belong to two parallel talks show up here.</p>';
 return `<div class="legend">Auto-matched by time; parallel sessions make some ambiguous. Tell Claude e.g. &ldquo;recording 09:54 = EDU07&rdquo; and it updates assignments.json.</div>`+D.inbox.map(i=>
  i.kind=='withheld'
   ? `<div class="card"><b>Withheld from the dashboard</b><div class="muted" style="margin-top:4px">${esc(i.when)} were not recognised as a slide or a poster, so they were <b>not copied into the conference folder</b> and are not shown anywhere here. If one of those was a slide, tell Claude the time and it will be pulled in.</div></div>`
   : `<div class="card"><b>${esc(i.kind)}</b> · ${esc(i.when)} · guess: <b>${i.guess.map(g=>g+' '+esc((T[g]||{}).speaker||'')).join(', ')||'none'}</b><div class="muted">other candidates: ${i.cands.filter(c=>!i.guess.includes(c)).map(c=>c+' '+esc((T[c]||{}).speaker||'')+' ('+esc((T[c]||{}).hall||'')+')').join(' · ')||'none'}</div>${i.kind=='photo'?`<div class="thumbs"><img src="${esc(i.what)}"></div>`:`<div class="muted">${esc(i.what)}</div>`}</div>`
 ).join('')}
function openTalk(id){const t=T[id];if(!t)return;const dr=document.getElementById('drawer');
 dr.innerHTML=`<button class="x" onclick="closeD()">Close ✕</button><div class="muted">${dayName(t.date)} ${t.time} · ${esc(t.hall)} · ${esc(t.session)}</div><h3><span class="code">${t.id}</span>${esc(t.title)}</h3><div><b>${esc(t.speaker)}</b> · ${esc(t.affiliation)} ${badges(t)}</div>
 ${t.authors?`<div class="muted" style="margin-top:4px">${esc(t.authors)}</div>`:''}
 ${t.takeaway?`<div class="card"><b>Key takeaway</b><br>${esc(t.takeaway)}</div>`:''}
 ${t.summary?`<div class="card sum"><b>Summary</b>${t.summary}</div>`:''}
 ${t.followups&&t.followups.length?`<div class="card"><b>Follow-ups</b><ul>${t.followups.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul></div>`:''}
 ${t.plan_note?`<div class="card"><b>Itinerary note (this slot)</b><br>${esc(t.plan_note)}</div>`:''}
 ${(t.recs.length||t.photos.length)?`<div class="card"><b>Media</b>${media(t)}</div>`:''}
 <h4>Abstract</h4>${t.abstract?`<div class="abs">${esc(t.abstract)}</div>`:`<p class="muted">${D.stats.no_abstracts?'Abstract text is not reproduced here \u2014 see the ESGCT 2026 abstract book.':'No abstract in the abstract book (invited talk).'}</p>`}
 ${t.rel_terms&&t.rel_terms.length?`<p class="muted">Relevance terms: ${esc(t.rel_terms.join(', '))}</p>`:''}`;
 dr.classList.add('open');document.getElementById('shade').classList.add('open');dr.scrollTop=0}
function openPoster(id){const p=D.posters.find(x=>x.id==id);const dr=document.getElementById('drawer');
 dr.innerHTML=`<button class="x" onclick="closeD()">Close ✕</button><div class="muted">Poster · ${(+p.id.slice(1))%2?'Wed 28, 13:30–15:30':'Thu 29, 14:00–16:00'}</div><h3><span class="code">${p.id}</span>${esc(p.title)}</h3><div class="muted">${esc(p.authors)}</div>${p.note?`<div class="card">${esc(p.note)}</div>`:''}${p.photos.length?`<div class="thumbs">${p.photos.map(x=>`<a href="${esc(x.f)}" target="_blank"><img src="${esc(x.th)}"></a>`).join('')}</div>`:''}<h4>Abstract</h4>${p.abstract?`<div class="abs">${esc(p.abstract)}</div>`:'<p class="muted">Abstract text is not reproduced here \u2014 see the ESGCT 2026 abstract book.</p>'}`;
 dr.classList.add('open');document.getElementById('shade').classList.add('open')}
function closeD(){document.getElementById('drawer').classList.remove('open');document.getElementById('shade').classList.remove('open')}
document.getElementById('shade').onclick=closeD;document.addEventListener('keydown',e=>{if(e.key=='Escape')closeD()});
document.getElementById('main').onclick=e=>{const c=e.target.closest('.chip');if(c){if(c.dataset.s)psort=c.dataset.s;else pr=c.dataset.r=='x'?null:RANGES[+c.dataset.r];render();return}
 if(e.target.closest('a,audio'))return;const r=e.target.closest('[data-id]');if(r)return openTalk(r.dataset.id);const p=e.target.closest('[data-p]');if(p)openPoster(p.dataset.p)};
function render(){renderTabs();const m=document.getElementById('main');
 m.innerHTML=tab=='track'?track():tab=='topics'?topics():tab=='posters'?posters():tab=='inbox'?inbox():day(tab)}
render();
</script>
</body>
</html>
